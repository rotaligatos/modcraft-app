<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShelfSync</title>
<meta name="theme-color" content="#0F6B5A">
<meta name="description" content="ShelfSync — depot inventory, sales and replenishment for WCLI and CWLI Modern Trade">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ShelfSync">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first app shell. Promodiser = single column + bottom tab bar; Plant = left rail + wide work area. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#E7ECEA; --line:#D3DBD8;
  --ink:#12201C; --ink-2:#4A5A54; --ink-3:#77857F;
  --accent:#0F6B5A; --accent-ink:#FFFFFF; --accent-soft:#DCEEE8;
  --good:#1E7F48; --good-soft:#DDF1E4; --warn:#9A6200; --warn-soft:#FBEBCB;
  --crit:#B93A26; --crit-soft:#F8DED8; --info:#2A6FC2; --info-soft:#DDE8F7;
  --series-1:#2a78d6; --series-band:rgba(42,120,214,.14); --grid:#E2E8E5;
  --shadow:0 1px 2px rgba(18,32,28,.06),0 4px 14px rgba(18,32,28,.05);
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px; --r-sm:7px;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1D2723; --line:#2A3631;
  --ink:#E6EEEA; --ink-2:#A8B6B0; --ink-3:#7A8983;
  --accent:#3DB399; --accent-ink:#06211B; --accent-soft:#163830;
  --good:#53C487; --good-soft:#163424; --warn:#E3A73F; --warn-soft:#3A2C10;
  --crit:#F06C56; --crit-soft:#3E1C16; --info:#6EA6EE; --info-soft:#18283D;
  --series-1:#3987e5; --series-band:rgba(57,135,229,.2); --grid:#24302B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1D2723; --line:#2A3631;
  --ink:#E6EEEA; --ink-2:#A8B6B0; --ink-3:#7A8983;
  --accent:#3DB399; --accent-ink:#06211B; --accent-soft:#163830;
  --good:#53C487; --good-soft:#163424; --warn:#E3A73F; --warn-soft:#3A2C10;
  --crit:#F06C56; --crit-soft:#3E1C16; --info:#6EA6EE; --info-soft:#18283D;
  --series-1:#3987e5; --series-band:rgba(57,135,229,.2); --grid:#24302B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.5rem;font-weight:800}
h2{font-size:1.12rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:.82rem}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--ink-3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:grid;gap:14px}
.stack-sm{display:grid;gap:8px}
.grow{flex:1;min-width:0}

/* ---------- Shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-inline:16px}
.topbar-in{display:flex;align-items:center;gap:12px;min-height:56px;max-width:1400px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:1.1rem;letter-spacing:-.02em}
.brand svg{flex:none}
.co-logos{display:flex;align-items:center;gap:6px;flex:none}
.co-logo{display:block;height:28px;width:auto;background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 6px;box-sizing:content-box}
.co-logos.big .co-logo{height:40px;padding:5px 9px}
.made-by{display:inline-flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted,#888);text-decoration:none;justify-self:center}
.made-by img{height:30px;width:auto;background:#fff;border-radius:6px;padding:3px 6px;border:1px solid var(--line)}
@media (max-width:639px){.topbar .brand span{display:none}}
.made-by.lg img{height:42px}
.rail-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.rail-foot .made-by img{height:42px}
@media print{.co-logos,.made-by{display:none!important}}
.ctx{min-width:0;display:flex;flex-direction:column;line-height:1.2;border-left:1px solid var(--line);padding-left:12px}
.ctx b{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx span{font-size:.74rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-btn{background:none;border:0;border-left:1px solid var(--line);text-align:left;cursor:pointer;color:inherit;font:inherit;align-items:flex-start}
.ctx-btn:hover b{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:.85rem;font-weight:600}
.iconbtn:hover{background:var(--surface-2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.78rem;font-family:var(--f-display)}

.main{padding-inline:16px;padding-block:18px 28px;max-width:1400px;margin-inline:auto}
.promo .main{max-width:760px;padding-bottom:calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{display:grid;grid-template-columns:repeat(6,1fr);max-width:760px;margin-inline:auto;height:var(--tabbar-h)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:600;color:var(--ink-3);cursor:pointer;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--crit);color:#fff;border-radius:999px;font-size:.62rem;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center}

.plant-layout{display:grid;grid-template-columns:1fr;gap:18px}
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.85rem;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.rail button[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rail .count{background:var(--crit);color:#fff;border-radius:999px;font-size:.68rem;padding:0 6px}
@media (min-width:960px){
  .plant-layout{grid-template-columns:210px minmax(0,1fr);gap:28px}
  .rail{flex-direction:column;position:sticky;top:calc(76px + env(safe-area-inset-top,0px));align-self:start;overflow:visible}
  .rail button{border:0;background:none;border-radius:var(--r-sm);padding:9px 12px;justify-content:flex-start}
  .rail button:hover{background:var(--surface-2)}
  .rail button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .rail .count{margin-left:auto}
  .rail .rail-sep{height:1px;background:var(--line);margin:8px 4px}
}
.rail-sep{display:none}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.section-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.grid-2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.list{display:grid}
.list > *{border-top:1px solid var(--line);padding-block:11px}
.list > *:first-child{border-top:0}

/* buttons & fields */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit)}
.btn.ghost{border-color:transparent;background:none}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.lg{min-height:48px;font-size:1rem}
label.f{display:grid;gap:5px;font-size:.8rem;font-weight:600;color:var(--ink-2);min-width:0}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 11px;min-height:40px;font-size:.95rem;color:var(--ink);font-weight:400}
textarea.in{min-height:80px;resize:vertical}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.in.qty{width:84px;text-align:right;font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:34px;height:36px;font-size:1.1rem;cursor:pointer}
.stepper input{border:0;width:52px;text-align:center;height:36px;background:var(--surface);font-variant-numeric:tabular-nums}
.searchbar{display:flex;gap:8px}
.searchbar .in{min-height:48px;font-size:1rem}

/* product line */
.prod{display:flex;align-items:center;gap:11px;min-width:0}
.sw{width:30px;height:30px;border-radius:5px;flex:none;border:1px solid rgba(0,0,0,.12);position:relative;overflow:hidden}
.sw::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.28),transparent 55%)}
.sw.eb{height:12px;align-self:center;border-radius:3px}
.prod .nm{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.prod .meta{font-size:.76rem;color:var(--ink-3)}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{text-align:left;font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.tbl tr.sel td{background:var(--accent-soft)}

/* KPI */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-size:1.55rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.kpi .d{font-size:.78rem;margin-top:2px}
.up{color:var(--good)} .down{color:var(--crit)}

.chart-box{position:relative;height:260px}
.chart-box.tall{height:300px}

/* stepper of approvals */
.chain{display:flex;gap:0;align-items:flex-start;overflow-x:auto;padding-block:4px}
.chain .st{flex:1 0 74px;display:grid;justify-items:center;text-align:center;gap:5px;position:relative;font-size:.68rem;color:var(--ink-3);font-weight:600;line-height:1.2;padding-inline:2px}
.chain .st::before{content:"";position:absolute;top:8px;left:-50%;right:50%;height:2px;background:var(--line);z-index:0}
.chain .st:first-child::before{display:none}
.chain .pin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface);z-index:1;display:grid;place-items:center}
.chain .st.done{color:var(--ink-2)}
.chain .st.done .pin{background:var(--accent);border-color:var(--accent)}
.chain .st.done::before,.chain .st.now::before{background:var(--accent)}
.chain .st.now{color:var(--ink)}
.chain .st.now .pin{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.chain .st.stop .pin{background:var(--crit);border-color:var(--crit)}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow-y:auto;padding:4px 2px}
.bubble{max-width:82%;padding:9px 12px;border-radius:14px;background:var(--surface-2);overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;border-bottom-left-radius:4px}
.bubble .who{font-size:.7rem;font-weight:700;opacity:.75;margin-bottom:2px}
.bubble .t{font-size:.66rem;opacity:.7;margin-top:3px;text-align:right}
.announce{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface)}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.qa{grid-template-columns:repeat(4,1fr)}}
.qa button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 12px;text-align:left;cursor:pointer;display:grid;gap:8px;min-height:92px}
.qa button:hover{border-color:var(--accent)}
.qa svg{width:24px;height:24px;color:var(--accent)}
.qa b{font-family:var(--f-display);font-size:.95rem}
.qa span{font-size:.74rem;color:var(--ink-3)}

/* login */
.login{max-width:880px;margin-inline:auto;padding-block:28px 40px;display:grid;gap:22px}
.login-hero{display:grid;gap:10px}
.login-hero h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.05}
.users{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.user{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:13px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left}
.user:hover{border-color:var(--accent)}
.user .avatar{width:38px;height:38px;flex:none}
.group-label{margin-top:6px}

/* misc */
.empty{padding:22px 12px;text-align:center;color:var(--ink-3);font-size:.9rem}
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom,0px));z-index:50;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:var(--r-sm);padding:11px 14px;font-weight:600;font-size:.88rem;box-shadow:var(--shadow);animation:pop .2s ease-out}
.toast.err{background:var(--crit);color:#fff}
.plant .toast-wrap{bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.list > .row.between{flex-wrap:nowrap}
.list > .row.between > .prod{flex:1}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.sheet-bg{position:fixed;inset:0;background:rgba(10,18,15,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){.sheet-bg{align-items:center}}
.sheet{background:var(--surface);width:min(100%,560px);max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.sheet{border-radius:16px}}
.menu{display:grid;gap:4px}
.menu button{border:0;background:none;text-align:left;padding:11px 10px;border-radius:var(--r-sm);cursor:pointer;font-weight:600}
.menu button:hover{background:var(--surface-2)}
.ai-out{line-height:1.6;max-width:78ch}
.ai-out h3{margin-top:16px;margin-bottom:4px;font-size:1rem}
.ai-out ul{margin:4px 0 8px;padding-left:20px}
.ai-out p{margin-block:6px}
.notice{border:1px dashed var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:.82rem;color:var(--ink-2);background:var(--surface)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters label.f{min-width:150px;flex:1 1 150px;max-width:240px}
.chipset{display:flex;gap:6px;flex-wrap:wrap}
.chipset button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chipset button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
details.explain summary{cursor:pointer;font-weight:600;font-size:.86rem;color:var(--accent)}
details.explain .formula{font-family:var(--f-mono);font-size:.8rem;background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;margin-top:8px;line-height:1.7;overflow-x:auto}
.hide-sm{display:none}
@media (min-width:640px){.hide-sm{display:initial}}
#scanner{width:100%;border-radius:var(--r);overflow:hidden;background:#000}
.legend-inline{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-2)}
.legend-inline i{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--series-1);vertical-align:middle;margin-right:6px}
.legend-inline i.dash{background:repeating-linear-gradient(90deg,var(--series-1) 0 4px,transparent 4px 7px)}
.legend-inline i.band{height:10px;background:var(--series-band)}
/* v2 */
.nowrap{white-space:nowrap}
.num.big,.big{font:800 1.45rem var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rail-h{display:none}
@media (min-width:960px){.rail-h{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--ink-3);padding:14px 12px 4px}.rail-h:first-child{padding-top:0}}
.sheet.wide{width:min(100%,880px)}
.sheet h2{margin-bottom:2px}
.login.narrow{max-width:460px}
.login-grid{display:grid;gap:22px;align-items:center}
@media (min-width:820px){.login-grid{grid-template-columns:1.1fr 1fr}}
.bio-card{text-align:center;justify-items:center}
.bio-card .btn{width:100%}
.bio-icon{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.bio-icon svg{width:34px;height:34px}
.btn svg{width:18px;height:18px;flex:none}
.kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.kv-grid b{font:800 1.15rem var(--f-display)}
.grid-3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}

<script>

/* =====================================================================

const CONFIG = {

  supabaseAnonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zc3ZpdXVhZ3RsdnhqdnZ2YWd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNDMzMzksImV4cCI6MjA5NzYxOTMzOX0.X3fzhId8srr4XZ9O54-hkBusQxoA6wfM2X8Kq-OoVN4", // public anon key (RLS protects the data)

/* ---------- small utils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const peso = n => "₱" + Number(n || 0).toLocaleString("en-PH", {maximumFractionDigits: 0});
const pesoK = n => { n = Number(n||0); return Math.abs(n) >= 1e6 ? "₱" + (n/1e6).toFixed(2) + "M" : Math.abs(n) >= 1e4 ? "₱" + (n/1e3).toFixed(0) + "K" : peso(n); };
const fmt = (n, d = 0) => Number(n || 0).toLocaleString("en-PH", {maximumFractionDigits: d, minimumFractionDigits: 0});
const DAY = 864e5;
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === "x" ? r : (r&3|8)).toString(16); });
const LS = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const today0 = () => startOfDay(Date.now());
const daysAgo = t => Math.floor((today0() - startOfDay(t)) / DAY);
const dshort = t => new Date(t).toLocaleDateString("en-PH", {month:"short", day:"numeric"});
const dtime = t => new Date(t).toLocaleString("en-PH", {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
const tonly = t => new Date(t).toLocaleTimeString("en-PH", {hour:"numeric", minute:"2-digit"});
const mean = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : 0;
const sd = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); };
const monthKey = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
const monthLabel = k => { const [y, m] = k.split("-"); return new Date(+y, +m - 1, 1).toLocaleDateString("en-PH", { month: "short", year: "numeric" }); };
const isoDate = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const fileSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const initials = n => String(n||"?").split(/\s+/).filter(w => /[A-Za-z]/.test(w)).map(w=>w[0]).slice(0,2).join("").toUpperCase() || "?";

function toast(msg, err) {
  const el = document.createElement("div");
  el.className = "toast" + (err ? " err" : "");
  el.textContent = msg;
  const w = $("#toasts"); while (w.children.length > 1) w.firstChild.remove();
  w.appendChild(el);
  setTimeout(() => el.remove(), err ? 5200 : 3000);
}

/* inverse normal CDF (Acklam) → z for a service level */
function zOf(p) {
  p = Math.min(Math.max(p, 0.5), 0.9999);
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628274631],
        b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
        c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
        d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  if (p <= 0.97575) { const q = p - 0.5, r = q*q;
    return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  const q = Math.sqrt(-2*Math.log(1-p));
  return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}

/* ---------- roles & approval chain ---------- */
const ROLES = { promodiser:"Promodiser", ppic:"PPIC", scm:"Supply Chain Manager", plant_mgr:"Plant Manager",
  smd:"Sales & Marketing Director", md:"Managing Director", admin:"Admin" };
const CHAIN = [
  { status:"for_ppic",       role:"ppic",       short:"PPIC",      label:"PPIC review",                 verb:"Endorse to Supply Chain" },
  { status:"for_scm",        role:"scm",        short:"SCM",       label:"Supply Chain Manager",        verb:"Approve" },
  { status:"for_plant_note", role:"plant_mgr",  short:"Plant",     label:"Plant Manager (to note)",            verb:"Mark as noted" },
  { status:"for_smd",        role:"smd",        short:"S&M Dir.",  label:"Sales & Marketing Director",  verb:"Confirm" },
  { status:"for_md",         role:"md",         short:"MD",        label:"Managing Director",           verb:"Give final approval" },
  { status:"approved",       role:"ppic",       short:"Dispatch",  label:"Approved, for dispatch",      verb:"Dispatch" },
  { status:"dispatched",     role:"promodiser", short:"In transit",label:"In transit",                  verb:"Confirm receipt" },
  { status:"received",       role:null,         short:"Received",  label:"Received" }
];
const STATUS_LABEL = Object.fromEntries(CHAIN.map(c => [c.status, c.label]));
STATUS_LABEL.rejected = "Rejected"; STATUS_LABEL.cancelled = "Cancelled";
/* Promodiser feature switches (set per person in the company Command Center › ShelfSync) */
const PERMS = [
  ["sell", "Record sales and missed sales"], ["count", "Stock count"], ["request", "Request stock"], ["receive", "Confirm deliveries"],
  ["other_depots", "See stock of same-chain branches in their region"], ["movements", "Stock card and damage / return / pull-out"],
  ["messages", "Messages with the Plant"], ["documents", "Send documents"], ["reports", "Submit depot reports"]];
const rolesOf = u => u ? [u.role].concat(u.extra_roles || []) : [];
const hasRole = (...rs) => !!ME && rs.some(r => rolesOf(ME).includes(r));
const rolesLabel = u => rolesOf(u).map(r => ROLES[r]).join(" · ");
/* Companies a Plant user handles: their own + any ticked in Command Center › ShelfSync. Admin and Managing Director
   see every company. The database enforces the same rule (ss_sees_depot), so this only keeps the screens tidy. */
const seesAll = () => hasRole("admin", "md");
const myCompanies = () => !ME ? [] : seesAll() ? (S.companies || []).map(c => c.id) : Array.from(new Set([ME.company_id].concat(ME.companies || []).filter(Boolean)));
const inMyCompany = c => !!ME && ME.role !== "promodiser" && (seesAll() || myCompanies().includes(c));
const companyScoped = () => !!ME && ME.role !== "promodiser" && !seesAll();
const myCompanyList = () => (S.companies || []).filter(c => !companyScoped() || myCompanies().includes(c.id));
/* a plant supplying part of a request (split supply) may see it */
const suppliesMe = r => !!ME && !!ME.plant_id && (S.request_lines || []).some(l => l.request_id === r.id && l.supply && Number(l.supply[ME.plant_id]) > 0);
const plantShort = id => ((idx.plant(id) || {}).name || id || "").replace(/ Plant$/, "");
const supplyText = (l, r) => l.supply ? Object.entries(l.supply).filter(([, q]) => Number(q) > 0).map(([k, q]) => plantShort(k) + " " + fmt(Number(q))).join(" · ") : plantShort(r.plant_id);
/* A promodiser may handle more than one depot: depot_id is the HOME depot, depot_ids any others.
   While signed in, ME.depot_id is the depot they are WORKING at (switch in the top bar); ME.home_depot_id keeps the home one. */
function withWorkingDepot(u) {
  if (!u || u.role !== "promodiser") return u;
  const home = u.home_depot_id || u.depot_id, ids = Array.from(new Set([home].concat(u.depot_ids || []).filter(Boolean)));
  const want = LS.get("shelfsync-depot-" + u.id);
  return { ...u, home_depot_id: home, depot_id: ids.includes(want) ? want : home };
}
const myDepotIds = () => !ME ? [] : Array.from(new Set([ME.home_depot_id || ME.depot_id].concat(ME.depot_ids || []).filter(Boolean)));
const can = p => !!ME && (ME.role !== "promodiser" || !ME.perms || ME.perms[p] !== false);
const DOC_TYPES = { delivery_receipt: "Delivery receipt", count_sheet: "Stock count sheet", pullout_slip: "Pull-out slip", damage_photo: "Damage photo",
  sellout_report: "Retailer sell-out report", shelf_photo: "Shelf / display photo", other: "Other" };
const MOVE_KINDS = { sale: ["Sale", "out"], receipt: ["Delivery received", "in"], count_adj: ["Count adjustment", "adj"], damage: ["Damaged", "out"],
  return: ["Customer return", "in"], pullout: ["Pull-out to Plant", "out"], transfer_in: ["Transfer in", "in"], transfer_out: ["Transfer out", "out"], opening: ["Opening balance", "adj"] };
const REGIONS = ["NCR", "CAR", "Ilocos", "Cagayan Valley", "Central Luzon", "Calabarzon", "Mimaropa", "Bicol", "Western Visayas", "Central Visayas",
  "Eastern Visayas", "Zamboanga Peninsula", "Northern Mindanao", "Davao", "Soccsksargen", "Caraga", "BARMM"];
const accessState = u => u.status === "suspended" ? "suspended" : (u.access_expires && u.access_expires < isoDate(Date.now())) ? "expired" : "active";
const OPEN_STATUSES = ["for_ppic","for_scm","for_plant_note","for_smd","for_md"];
const statusChip = s => {
  const cls = s === "received" ? "good" : (s === "rejected" || s === "cancelled") ? "crit" : s === "dispatched" ? "info" : s === "approved" ? "accent" : "warn";
  const who = CHAIN.find(c => c.status === s);
  const txt = OPEN_STATUSES.includes(s) ? "With " + who.short : STATUS_LABEL[s];
  return `<span class="chip ${cls}"><span class="dot"></span>${esc(txt)}</span>`;
};

/* =====================================================================
   DATA STORE
   ===================================================================== */
let S = null;          // the store
let ME = null;         // current profile
let MODE = "demo";     // 'demo' | 'live'
let SB = null;         // supabase client
let CACHE = {};        // derived data cache, cleared on change
const DOCBLOBS = new Map();   // demo only: uploaded files kept for this browser session
const bump = () => { CACHE = {}; if (MODE === "demo") persistDemo(); };

const idx = {
  depot: id => S.depots.find(d => d.id === id),
  product: id => S.products.find(p => p.id === id),
  account: id => S.accounts.find(a => a.id === id) || { id, name: id || "—" },
  plant: id => S.plants.find(p => p.id === id) || { id, name: id || "—" },
  user: id => (S.users || []).find(u => u.id === id),
  stock: (d,p) => S.stock.find(s => s.depot_id === d && s.product_id === p),
};
function stockMap() {
  if (CACHE.stockMap) return CACHE.stockMap;
  const m = new Map(); S.stock.forEach(s => m.set(s.depot_id + "|" + s.product_id, s));
  return CACHE.stockMap = m;
}
const onHand = (d,p) => (stockMap().get(d + "|" + p) || {}).on_hand || 0;
function priceFor(p, depot) {
  if (!CACHE.prices) { CACHE.prices = new Map(); (S.prices || []).forEach(r => CACHE.prices.set(r.product_id + "|" + r.account_id, Number(r.price))); }
  const v = depot ? CACHE.prices.get(p.id + "|" + depot.account_id) : undefined;
  return v != null ? v : Number(p.srp || 0);
}
const setting = k => (S.settings || {})[k];
const bioPolicy = () => ({ login: true, actions: true, ...(setting("passkey_policy") || {}) });
const odooRule = () => setting("odoo_ticket_required") || "ppic_review";
const userName = id => { const u = idx.user(id); return u ? u.full_name : ""; };

/* the role the signed-in person acts in at this request's current step (null = can't act) */
function actingRole(r) {
  const st = CHAIN.find(c => c.status === r.status); if (!st || !st.role) return null;
  if (st.role === "promodiser") {                      // receiving: the depot's promodiser, or PPIC for depots without one
    if (ME.role === "promodiser") return myDepotIds().includes(r.depot_id) && can("receive") ? "promodiser" : null;
    return hasRole("ppic") && inMyCompany(r.company_id) ? "ppic" : null;
  }
  if (!hasRole(st.role)) return null;
  if (!inMyCompany(r.company_id)) return null;            // each person acts only for the companies they handle
  return st.role;
}
/* same rule as ss_clean_supply: real plants with qty > 0; null when everything comes from the usual plant */
function cleanSupply(sup, main) {
  const out = {}; Object.entries(sup || {}).forEach(([k, q]) => { q = Number(q); if (idx.plant(k) && q > 0) out[k] = q; });
  const ks = Object.keys(out); return !ks.length || (ks.length === 1 && ks[0] === main) ? null : out;
}
/* ---------- local engine: same rules as the database triggers ---------- */
function needConfirm(ref, confirm_id) {
  if (MODE === "live") return;                          // the database checks this
  if (!bioPolicy().actions || (ME && ME.require_passkey === false)) return;
  if (!(S.passkeys || []).some(k => k.user_id === ME.id)) throw new Error("Set up Face ID / fingerprint first (menu › Biometrics)");
  if (!confirm_id) throw new Error("Biometric confirmation required");
}
function routeDepot(d) {
  const a = idx.account(d.account_id), dc = a && a.consolidation_depot_id ? idx.depot(a.consolidation_depot_id) : null;
  if (d.is_consolidation_dc) d.ship_via_depot_id = null;
  else if (a && a.fulfilment === "consolidated" && dc && dc.plant_id === d.plant_id) d.ship_via_depot_id = dc.id;
  else d.ship_via_depot_id = null;
  return d;
}
const Engine = {
  move(depot_id, product_id, qty, kind, ref_id, at, extra = {}) {
    const k = depot_id + "|" + product_id;
    let s = stockMap().get(k);
    if (!s) { s = { depot_id, product_id, on_hand: 0, min_display: 0 }; S.stock.push(s); stockMap().set(k, s); }
    s.on_hand += qty; s.updated_at = at || new Date().toISOString();
    if (kind !== "sale") S.movements.push({ id: extra.id || uuid(), depot_id, product_id, qty, kind, ref_id, ref_text: extra.ref_text || null, note: extra.note || null,
      affects_stock: true, created_by: ME ? ME.id : null, created_at: at || new Date().toISOString() });
  },
  sale({ id, depot_id, receipt_no, lines, sold_at }) {
    if (!can("sell")) throw new Error("Recording sales is switched off for your account");
    const at = sold_at || new Date().toISOString();
    const total = lines.reduce((s,l) => s + l.qty * l.unit_price, 0);
    S.sales.push({ id, depot_id, receipt_no, sold_at: at, total_amount: total, affects_stock: true, created_by: ME.id });
    lines.forEach(l => { S.sale_lines.push({ id: uuid(), sale_id: id, product_id: l.product_id, qty: l.qty, unit_price: l.unit_price });
      Engine.move(depot_id, l.product_id, -l.qty, "sale", id, at); });
  },
  lost({ id, depot_id, product_id, qty, note }) {
    S.lost_sales.push({ id, depot_id, product_id, qty, note, created_by: ME.id, created_at: new Date().toISOString() });
  },
  count({ id, depot_id, note, lines }) {
    if (!can("count")) throw new Error("Stock count is switched off for your account");
    const at = new Date().toISOString();
    S.counts.push({ id, depot_id, note, created_by: ME.id, created_at: at });
    const out = [];
    lines.forEach(l => {
      const sys = onHand(depot_id, l.product_id);
      S.count_lines.push({ id: uuid(), count_id: id, product_id: l.product_id, system_qty: sys, counted_qty: l.counted_qty });
      if (l.counted_qty !== sys) Engine.move(depot_id, l.product_id, l.counted_qty - sys, "count_adj", id, at);
      out.push({ ...l, system_qty: sys, variance: l.counted_qty - sys });
    });
    return out;
  },
  movement({ id, depot_id, product_id, kind, qty, note }) {
    if (ME.role === "promodiser" && (!can("movements") || !["damage", "return", "pullout"].includes(kind))) throw new Error("Not allowed");
    const signed = MOVE_KINDS[kind][1] === "out" ? -Math.abs(qty) : Math.abs(qty);
    Engine.move(depot_id, product_id, signed, kind, null, null, { id, note });
  },
  request({ id, depot_id, origin, note, needed_by, lines, confirm_id, odoo_ticket_ref }) {
    if (ME.role === "promodiser" && !can("request")) throw new Error("Requesting stock is switched off for your account");
    needConfirm("request:" + id, confirm_id);
    if (origin === "ppic" && odooRule() === "ppic_review" && !String(odoo_ticket_ref || "").trim()) throw new Error("Enter the Odoo ticket number first");
    const dp = idx.depot(depot_id);
    const n = S.requests.reduce((m, r) => Math.max(m, Number(String(r.req_no || "").split("-").pop()) || 0), 0) + 1;
    const now = new Date();
    const req = { id, req_no: "RR-" + String(now.getFullYear()).slice(2) + String(now.getMonth()+1).padStart(2,"0") + "-" + String(n).padStart(4,"0"),
      company_id: dp.company_id, plant_id: dp.plant_id, depot_id, ship_to_depot_id: dp.ship_via_depot_id || dp.id,
      origin, status: origin === "ppic" ? "for_scm" : "for_ppic", note, needed_by, confirm_id: confirm_id || null,

/* ---------- write API ----------
   Offline-capable ops apply locally first and queue for sync.
   Online-only ops (biometric actions, files, admin) go to the server first. */
const OUTBOX_KEY = "shelfsync-outbox";
const OFFLINE_OK = new Set(["sale", "lost", "count", "movement", "message", "depotReport", "retailerSales", "competitor", "updateStocks", "updateDepot"]);
let outbox = LS.get(OUTBOX_KEY) || [];
const API = {
  async run(op, payload) {
    if (MODE === "live" && !OFFLINE_OK.has(op)) {
      if (!navigator.onLine) { const e = new Error("You're offline. This needs an internet connection."); toast(e.message, true); throw e; }
      try { await Remote[op](payload); }
      catch (e) { toast(e.message, true); throw e; }
      let result; try { result = Engine[op](payload); } catch (e) { console.warn("local apply", e); }
      bump(); loadLive(true).catch(() => {});
      return result;
    }
    let result;
    try { result = Engine[op](payload); }
    catch (e) { toast(e.message, true); throw e; }
    bump();
    if (MODE === "live") { outbox.push({ op, payload, at: Date.now() }); LS.set(OUTBOX_KEY, outbox); flushOutbox(); }
    return result;
  }
};
let flushing = false;
async function flushOutbox() {
  if (MODE !== "live" || flushing || !navigator.onLine || !outbox.length) { renderSync(); return; }
  flushing = true; renderSync();
  try {
    while (outbox.length) {
      await Remote[outbox[0].op](outbox[0].payload);
      outbox.shift(); LS.set(OUTBOX_KEY, outbox);
    }
    await loadLive(true);
  } catch (e) {
    console.warn("sync paused", e);
    if (e && e.permanent) { toast("Could not sync: " + e.message, true); outbox.shift(); LS.set(OUTBOX_KEY, outbox); await loadLive(true); }
  } finally { flushing = false; renderSync(); }
}
const sbErr = (error) => { const e = new Error(error.message || String(error)); e.permanent = !!(error.code && /^(23|42|P0)/.test(error.code)); return e; };
const chk = r => { if (r.error) throw sbErr(r.error); return r.data; };
async function fn(name, body) {
  const { data, error } = await SB.functions.invoke(name, { body });
  if (error) { let msg = error.message; try { const j = await error.context.json(); msg = j.error || msg; } catch (e) {} throw new Error(msg); }
  if (data && data.error) throw new Error(data.error);
  return data;
}

async function loadScript(src) {

function H() { return Math.max(30, Number(S.settings.history_days) || 90); }

    if (!sold.has(k)) { sold.set(k, new Float64Array(span)); amt.set(k, new Float64Array(span)); }

    const d = Math.floor((t0 - startOfDay(l.created_at)) / DAY); if (d < 0 || d >= span) return;
    const k = l.depot_id + "|" + l.product_id; if (!lost.has(k)) lost.set(k, new Float64Array(span)); lost.get(k)[d] += l.qty;

    .concat((S.delivery_history || []).filter(h => h.depot_id === dp.id && h.requested_on).map(h => (new Date(h.received_on) - new Date(h.requested_on)) / DAY)).filter(x => x >= 3 && x < 150);

}

}

function weeklyProjection(money) {

  if (!CACHE.aiIdx) { CACHE.aiIdx = new Map(); (S.ai_recs || []).forEach(r => { const k = r.depot_id + "|" + r.product_id, cur = CACHE.aiIdx.get(k); if (!cur || cur.created_at < r.created_at) CACHE.aiIdx.set(k, r); }); }
  const r = CACHE.aiIdx.get(depot_id + "|" + product_id);
  return r && (Date.now() - new Date(r.created_at)) < 21 * DAY ? r : null;
}
/* monthly sales rows across all history: [{depot_id, product_id, month:'YYYY-MM', created_by, units, amount, receipts}] */
function monthlyRows() {
  if (CACHE.monthly) return CACHE.monthly;
  if (MODE === "live" && S.monthly && S.monthly.length) return CACHE.monthly = S.monthly;
  const saleById = new Map(S.sales.map(s => [s.id, s])), m = new Map();
  S.sale_lines.forEach(l => {
    const s = saleById.get(l.sale_id); if (!s) return;
    const k = s.depot_id + "|" + l.product_id + "|" + monthKey(s.sold_at) + "|" + (s.created_by || "");
    let r = m.get(k); if (!r) { r = { depot_id: s.depot_id, product_id: l.product_id, month: monthKey(s.sold_at), created_by: s.created_by, units: 0, amount: 0, _r: new Set() }; m.set(k, r); }
    r.units += l.qty; r.amount += l.qty * l.unit_price; r._r.add(s.id);
  });
  return CACHE.monthly = Array.from(m.values()).map(({ _r, ...r }) => ({ ...r, receipts: _r.size }));
}
/* encoded sales for depot × item within [from, to] (inclusive ISO dates) */
function encodedBetween(depotIds, from, to) {
  const f = new Date(from + "T00:00:00").getTime(), t = new Date(to + "T23:59:59").getTime(), ds = new Set(depotIds), out = new Map();
  const saleById = new Map(S.sales.filter(s => ds.has(s.depot_id) && s.affects_stock !== false).map(s => [s.id, s]));
  S.sale_lines.forEach(l => { const s = saleById.get(l.sale_id); if (!s) return; const at = new Date(s.sold_at).getTime(); if (at < f || at > t) return;
    const k = s.depot_id + "|" + l.product_id; const r = out.get(k) || { qty: 0, amount: 0 }; r.qty += l.qty; r.amount += l.qty * l.unit_price; out.set(k, r); });
  return out;
}
/* on-hand for depot × item at the end of a given day, by walking back from today */
function stockAt(depot_id, product_id, isoDay) {
  const end = new Date(isoDay + "T23:59:59").getTime(); let q = onHand(depot_id, product_id);
  S.movements.forEach(m => { if (m.depot_id === depot_id && m.product_id === product_id && m.affects_stock !== false && new Date(m.created_at).getTime() > end) q -= m.qty; });
  const saleIds = new Set(S.sales.filter(s => s.depot_id === depot_id && s.affects_stock !== false && new Date(s.sold_at).getTime() > end).map(s => s.id));
  S.sale_lines.forEach(l => { if (l.product_id === product_id && saleIds.has(l.sale_id)) q += l.qty; });
  return q;
}

/* space for a depot × category: depot-specific setting, else the account default */
function capacityFor(dp, category) {
  if (!category || !S.capacity) return null;
  const own = S.capacity.find(c => c.depot_id === dp.id && c.category === category);
  if (own) return own.max_qty;
  const acct = S.capacity.find(c => !c.depot_id && c.account_id === dp.account_id && c.category === category);
  return acct ? acct.max_qty : null;
}
function spaceSummary(dp) {
  const cats = Array.from(new Set(S.products.filter(p => p.company_id === dp.company_id).map(p => p.category).filter(Boolean)));
  return cats.map(category => { const cap = capacityFor(dp, category); if (cap == null) return null;
    let used = 0; S.products.filter(p => p.category === category && p.company_id === dp.company_id).forEach(p => { const pq = pipelineQty(dp.id, p.id); used += onHand(dp.id, p.id) + pq.transit + pq.pending; });
    return { category, cap, used, room: Math.max(0, cap - used) }; }).filter(Boolean);
}

  async localCreate(user) {
    const cred = await navigator.credentials.create({ publicKey: {

      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],

        const prev = ME; ME = ME || user; Engine.addPasskey({ id: uuid(), user_id: user.id, credential_id, device_label: deviceLabel() + (simulate ? " (simulated)" : ""), created_at: new Date().toISOString() }); ME = prev; bump(); return true; } });

  /* confirm an action; returns a confirmation id the database accepts */

    if (!Bio.has()) { await Bio.enroll(); }

  async verifyLogin(user) {

  },
  /* usernameless: the device offers the account's passkey; no email needed */
  async passwordless() {

const myDepot = () => idx.depot(ME.depot_id);

function shipNote(dp) {

  return `Supplied by ${esc(idx.plant(dp.plant_id).name)}${via ? " · ships via " + esc(via.name) : " · direct delivery"}`;
}
function miniChain(r) {
  if (r.status === "rejected" || r.status === "cancelled") return "";
  const steps = CHAIN.slice(r.origin === "ppic" ? 1 : 0); const cur = steps.findIndex(c => c.status === r.status);
  return `<div class="chain" aria-label="Approval progress">${steps.map((c, i) => `<div class="st ${i < cur || r.status === "received" ? "done" : i === cur ? "now" : ""}"><span class="pin"></span>${esc(c.short)}</div>`).join("")}</div>`;
}
const itemOptions = (sel, withStock) => myProducts().map(p => opt(p.id, p.sku + " · " + p.name + (withStock ? " (" + fmt(onHand(ME.depot_id, p.id)) + " on hand)" : ""), sel)).join("");

const branchDepots = () => { const me = myDepot(); return S.depots.filter(d => d.active !== false && !d.is_consolidation_dc && d.account_id === me.account_id && (d.region || "") === (me.region || "")); };

function depotSummary(depot_id, from, to) {
  const f = new Date(from + "T00:00:00").getTime(), t = new Date(to + "T23:59:59").getTime(), inR = x => { const v = new Date(x).getTime(); return v >= f && v <= t; };
  const sales = S.sales.filter(s => s.depot_id === depot_id && s.affects_stock !== false && inR(s.sold_at)), ids = new Set(sales.map(s => s.id)), byP = {};
  S.sale_lines.forEach(l => { if (ids.has(l.sale_id)) byP[l.product_id] = (byP[l.product_id] || 0) + l.qty; });
  const moves = S.movements.filter(m => m.depot_id === depot_id && inR(m.created_at));
  return { sales_amount: sales.reduce((s, x) => s + Number(x.total_amount || 0), 0), receipts: sales.length, units: Object.values(byP).reduce((s, x) => s + x, 0),
    items: Object.entries(byP).sort((a, b) => b[1] - a[1]).map(([product_id, qty]) => ({ product_id, qty })),
    missed: S.lost_sales.filter(l => l.depot_id === depot_id && inR(l.created_at)).reduce((s, l) => s + l.qty, 0),
    counts: S.counts.filter(c => c.depot_id === depot_id && inR(c.created_at)).length,
    received: moves.filter(m => m.kind === "receipt").reduce((s, m) => s + m.qty, 0),
    damaged: -moves.filter(m => m.kind === "damage").reduce((s, m) => s + m.qty, 0),
    low: S.stock.filter(s => s.depot_id === depot_id && s.on_hand <= s.min_display).map(s => ({ product_id: s.product_id, on_hand: s.on_hand })) };
}

function groupSellouts(rows) {
  const g = new Map(); rows.forEach(r => { const k = r.depot_id + "|" + r.period_start + "|" + r.period_end; const x = g.get(k) || { depot_id: r.depot_id, period_start: r.period_start, period_end: r.period_end, lines: 0, qty: 0, amount: 0, source: r.source, created_at: r.created_at };
    x.lines++; x.qty += r.qty; x.amount += r.amount || 0; g.set(k, x); });
  return Array.from(g.values()).sort((a, b) => b.period_end.localeCompare(a.period_end));
}

function approvalDetail(r) {
  const dp = idx.depot(r.depot_id), via = r.ship_to_depot_id && r.ship_to_depot_id !== r.depot_id ? idx.depot(r.ship_to_depot_id) : null;

  const plan = Object.fromEntries(planRows().filter(x => x.dp.id === r.depot_id).map(x => [x.p.id, x]));
  const step = CHAIN.find(c => c.status === r.status);
  const actAs = actingRole(r), canAct = step && step.role && step.role !== "promodiser" && !!actAs;
  const canEditQty = canAct && ["for_ppic", "for_scm"].includes(r.status) && ["ppic", "scm"].includes(actAs);
  // split supply: PPIC / Supply Chain while reviewing, PPIC again just before dispatch (same total)
  const canSplit = canEditQty || (canAct && r.status === "approved" && actAs === "ppic");
  const others = (S.plants || []).filter(p => p.id !== r.plant_id);
  const odooEditable = hasRole("ppic") && !["received", "rejected", "cancelled"].includes(r.status);
  const needOdoo = canAct && ((r.status === "for_ppic" && odooRule() === "ppic_review") || (r.status === "approved" && odooRule() !== "off"));
  const events = S.request_events.filter(e => e.request_id === r.id).sort((a, b) => a.created_at.localeCompare(b.created_at));
  const docs = (S.documents || []).filter(d => d.request_id === r.id), space = spaceSummary(dp);
  const open = !["received", "rejected", "cancelled"].includes(r.status);
  let total = 0;
  const reasons = lines.map(l => plan[l.product_id] && plan[l.product_id].ai ? { p: idx.product(l.product_id), ai: plan[l.product_id].ai } : null).filter(Boolean);
  return `<div class="card stack">
    <div class="row between"><div><div class="eyebrow">${r.origin === "ppic" ? "Raised by PPIC" : "Raised by promodiser"}</div><h2 class="mono" style="font-family:var(--f-mono)">${esc(r.req_no)}</h2></div>${statusChip(r.status)}</div>
    ${miniChain(r)}
    <div class="small muted"><b>${esc(dp.name)}</b> · ${esc(idx.account(dp.account_id).name)} · ${esc(dp.company_id || "")} · usually supplied by ${esc(idx.plant(r.plant_id).name)}<br>${via ? "Deliver to " + esc(via.name) + " (consolidated, then to branch)" : "Direct delivery to depot"}${r.needed_by ? " · needed by " + dshort(r.needed_by) : ""}</div>
    ${r.note ? `<div class="notice">${esc(r.note)}</div>` : ""}

/* tiny markdown for AI output */
function md(t) {
  const lines = String(t || "").split(/\n/); let out = "", inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, '<span class="mono">$1</span>');
  lines.forEach(l => {
    if (/^\s*[-*•]\s+/.test(l)) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + inline(l.replace(/^\s*[-*•]\s+/, "")) + "</li>"; return; }
    if (inList) { out += "</ul>"; inList = false; }
    if (/^#{1,4}\s/.test(l)) out += "<h3>" + inline(l.replace(/^#+\s/, "")) + "</h3>";
    else if (l.trim()) out += "<p>" + inline(l) + "</p>";
  });
  if (inList) out += "</ul>";
  return out;
}

function demoAnalysis(P) {
  const ch = P.kpis.sales_prev_30d ? (P.kpis.sales_30d - P.kpis.sales_prev_30d) / P.kpis.sales_prev_30d : 0;
  const nf = P.projection_next8.slice(0, 4).reduce((s, x) => s + x, 0);
  const totalSug = P.reorder_now.reduce((s, x) => s + x.suggested_qty, 0);
  let t = `## Summary\nSales in the last 30 days were **${peso(P.kpis.sales_30d)}**, ${ch >= 0 ? "up" : "down"} ${fmt(Math.abs(ch * 100), 1)}% from the 30 days before. The projection for the next 4 weeks is about **${peso(nf)}** (typical weekly error ±${peso(P.projection_rmse)}).\n`;
  t += `${P.reorder_now.length} item-depot combinations are at or below their reorder point. Suggested total: **${fmt(totalSug)} units**.\n`;
  if (P.reorder_now.length) { t += `## Replenish first\n`; P.reorder_now.slice(0, 6).forEach(x => t += `- **${x.sku}** at ${x.depot}: ${x.on_hand} on hand, sells ${x.avg_daily}/day, lead time ~${Math.round(x.lead_time_days)} days. Order **${x.suggested_qty}** (safety stock ${x.safety_stock}).\n`); }
  if (P.top_missed_sales.length) { t += `## Missed sales\n`; P.top_missed_sales.slice(0, 4).forEach(x => t += `- **${x.sku}** at ${x.depot}: ${x.missed_sales_logged} units asked for while out of stock. Demand is higher than sales show; the suggestion already includes these.\n`); }
  if (P.overstock.length) { t += `## Overstock to watch\n`; P.overstock.slice(0, 4).forEach(x => t += `- **${x.sku}** at ${x.depot}: ${x.days_cover ?? "many"} days of cover. Hold replenishment; consider a transfer to a depot running low or an in-store display push.\n`); }
  t += `## Lead-time risk\nWith 30–45 day lead times, one month of demand is always in transit. Items with high day-to-day variation (std dev close to or above the average) carry most of the safety stock. Keep requests flowing through approvals quickly: each day of approval time adds a day of lead time.`;
  return t;
}

/* all stock-affecting movements (incl. sales) for depots × optional item, newest first, with balance after each line */
function movementRows({ depots, product, from, to, kinds }) {
  const ds = new Set(depots), f = from ? new Date(from).getTime() : 0, t = to ? new Date(to).getTime() : Infinity;
  const rows = [];
  S.movements.forEach(m => { if (!ds.has(m.depot_id) || (product && m.product_id !== product) || m.affects_stock === false) return;
    rows.push({ at: m.created_at, depot_id: m.depot_id, product_id: m.product_id, qty: m.qty, kind: m.kind, ref: m.ref_text || "", note: m.note || "", by: m.created_by, id: m.id }); });
  const saleById = new Map(S.sales.filter(s => ds.has(s.depot_id) && s.affects_stock !== false).map(s => [s.id, s]));
  S.sale_lines.forEach(l => { const s = saleById.get(l.sale_id); if (!s || (product && l.product_id !== product)) return;
    rows.push({ at: s.sold_at, depot_id: s.depot_id, product_id: l.product_id, qty: -l.qty, kind: "sale", ref: s.receipt_no || "", note: "", by: s.created_by, id: l.id, price: l.unit_price }); });
  rows.sort((a, b) => b.at.localeCompare(a.at));
  const bal = new Map();
  rows.forEach(r => { const k = r.depot_id + "|" + r.product_id; if (!bal.has(k)) bal.set(k, onHand(r.depot_id, r.product_id)); r.balance = bal.get(k); bal.set(k, r.balance - r.qty); });
  return rows.filter(r => { const v = new Date(r.at).getTime(); return v >= f && v <= t && (!kinds || kinds.includes(r.kind)); });
}

/* upload a list of files as documents; returns the created ids */
async function sendFiles(files, meta) {
  if (!files || !files.length) return [];
  if (MODE === "live" && !navigator.onLine) { toast("You're offline. Files will need an internet connection.", true); return []; }
  const ids = [];
  for (const file of files) {
    if (file.size > 20 * 1048576) { toast(file.name + " is over 20 MB", true); continue; }
    const id = uuid();
    await API.run("document", { id, depot_id: meta.depot_id, request_id: meta.request_id || null, message_id: meta.message_id || null, report_id: meta.report_id || null,
      competitor_id: meta.competitor_id || null, doc_type: meta.doc_type || "other", title: file.name, file_path: meta.depot_id + "/" + id + "/" + safeName(file.name),
      mime: file.type || null, size_bytes: file.size, note: meta.note || null, _blob: file });
    ids.push(id);
  }
  return ids;
}

const prevMonth = (k, n = 1) => { const [y, m] = k.split("-").map(Number); const d = new Date(y, m - 1 - n, 1); return monthKey(d); };
const pctTxt = v => v == null || !isFinite(v) ? "—" : (v >= 0 ? "▲ " : "▼ ") + fmt(Math.abs(v * 100), 1) + "%";
const pctCls = v => v == null || !isFinite(v) ? "faint" : v >= 0 ? "up" : "down";
function perfData(f, month) {
  const ds = new Set(scopeDepots(f).map(d => d.id)), rows = monthlyRows().filter(r => ds.has(r.depot_id));
  const sum = (filter) => rows.filter(filter).reduce((a, r) => ({ u: a.u + r.units, a: a.a + r.amount, n: a.n + r.receipts }), { u: 0, a: 0, n: 0 });
  return { ds, rows, sum };
}

    await API.run("aiRecs", { rows: recs.filter(r => byKey.has(r.key)).map(r => { const [depot_id, product_id] = r.key.split("|"), i = byKey.get(r.key); return { depot_id, product_id, base_qty: i.formula_qty_after_space, ai_qty: clamp(i, r.qty), reason: String(r.reason || "").slice(0, 400), model }; }) });
    UI.planF = "ai"; toast("AI advice added for " + recs.length + " items");
  } catch (e) { if (!e.cancelled) toast("AI advice failed: " + e.message, true); }
  UI.aiRecBusy = false; rerender();
}

/* apply an import (demo: local; live: batched inserts) */
async function applyImport(kind, rows, filename) {
  const imp = { id: uuid(), kind, filename, row_count: rows.length, created_by: ME.id, created_at: new Date().toISOString() };
  const salesGroups = () => { const g = new Map(); rows.forEach(r => { const k = r.depot_id + "|" + r.date + "|" + (r.receipt || ""); if (!g.has(k)) g.set(k, { id: uuid(), depot_id: r.depot_id, sold_at: r.date + "T12:00:00+08:00", receipt_no: r.receipt || "Tracker " + r.date, lines: [] }); g.get(k).lines.push(r); }); return Array.from(g.values()); };
  if (MODE === "live") {
    const ins = async (t, list, o) => { for (let i = 0; i < list.length; i += 500) chk(await (o ? SB.from(t).upsert(list.slice(i, i + 500), o) : SB.from(t).insert(list.slice(i, i + 500)))); };
    chk(await SB.from("ss_imports").insert({ id: imp.id, kind, filename, row_count: rows.length }));
    if (kind === "items") {
      const prods = rows.map(r => { const ex = S.products.find(p => p.sku === r.sku); return { id: ex ? ex.id : uuid(), company_id: r.company_id, sku: r.sku, barcode: r.barcode, name: r.name, category: r.category, brand: r.brand, uom: r.uom, pack_qty: r.pack_qty, srp: r.srp, active: true }; });
      await ins("ss_products", prods, { onConflict: "sku" });
      const pr = []; rows.forEach((r, i) => Object.entries(r.prices).forEach(([a, v]) => pr.push({ product_id: prods[i].id, account_id: a, price: v })));
      if (pr.length) await ins("ss_prices", pr, { onConflict: "product_id,account_id" });
    } else if (kind === "depots") {
      const dcs = rows.filter(r => r.is_consolidation_dc), rest = rows.filter(r => !r.is_consolidation_dc);
      const row = r => { const ex = S.depots.find(d => d.code === r.code); const { _n, _err, exists, ...d } = r; return { id: ex ? ex.id : uuid(), ...d, active: true }; };
      await ins("ss_depots", dcs.map(row), { onConflict: "code" }); await ins("ss_depots", rest.map(row), { onConflict: "code" });
    } else if (kind === "sales_history") {
      const gs = salesGroups();
      await ins("ss_sales", gs.map(g => ({ id: g.id, depot_id: g.depot_id, sold_at: g.sold_at, receipt_no: g.receipt_no, affects_stock: false, import_id: imp.id })));
      await ins("ss_sale_lines", gs.flatMap(g => g.lines.map(l => ({ sale_id: g.id, product_id: l.product_id, qty: l.qty, unit_price: Math.round(l.unit_price * 100) / 100 }))).filter(l => l.qty > 0));
    } else if (kind === "retailer_sales") {
      await ins("ss_retailer_sales", rows.map(r => ({ depot_id: r.depot_id, product_id: r.product_id, period_start: r.period_start, period_end: r.period_end, qty: r.qty, amount: r.amount, ending_stock: r.ending_stock, source: /pdf|png|jpe?g|heic/i.test(filename) ? "pdf" : "excel", import_id: imp.id })));
    } else if (kind === "stock_history") await ins("ss_stock_snapshots", rows.map(r => ({ depot_id: r.depot_id, product_id: r.product_id, as_of: r.date, qty: r.qty, import_id: imp.id })));
    else if (kind === "deliveries_history") await ins("ss_delivery_history", rows.map(r => ({ depot_id: r.depot_id, product_id: r.product_id, qty: r.qty, requested_on: r.requested_on, received_on: r.received_on, ref: r.ref, import_id: imp.id })));
    else if (kind === "targets") await ins("ss_targets", rows.map(r => ({ depot_id: r.depot_id, month: r.month, amount: r.amount, units: r.units, import_id: imp.id })), { onConflict: "depot_id,month" });
    else if (kind === "opening_stock") {
      const by = {}; rows.forEach(r => (by[r.depot_id] = by[r.depot_id] || []).push(r));
      for (const [d, ls] of Object.entries(by)) { const cid = uuid(); chk(await SB.from("ss_counts").insert({ id: cid, depot_id: d, note: "Opening balance import: " + filename, import_id: imp.id }));
        await ins("ss_count_lines", ls.map(l => ({ count_id: cid, product_id: l.product_id, counted_qty: l.qty }))); }
    }
    await loadLive(true); return;
  }
  // demo
  if (["items", "depots"].includes(kind)) S.imports.push(imp);
  if (kind === "items") rows.forEach(r => { const ex = S.products.find(p => p.sku === r.sku); Engine.saveProduct({ product: { ...(ex || {}), id: ex ? ex.id : uuid(), company_id: r.company_id, sku: r.sku, barcode: r.barcode, name: r.name, category: r.category, brand: r.brand, uom: r.uom, pack_qty: r.pack_qty, srp: r.srp, active: true, swatch: ex ? ex.swatch : "#cccccc" }, prices: r.prices }); });
  else if (kind === "depots") rows.slice().sort((a, b) => b.is_consolidation_dc - a.is_consolidation_dc).forEach(r => { const ex = S.depots.find(d => d.code === r.code); const { _n, _err, exists, ...d } = r; Engine.saveDepot({ depot: { ...(ex || {}), id: ex ? ex.id : uuid(), ...d, active: true } }); });
  else {
    S.imports.push(imp);
    if (kind === "sales_history") salesGroups().forEach(g => { const ls = g.lines.filter(l => l.qty > 0); S.sales.push({ id: g.id, depot_id: g.depot_id, sold_at: g.sold_at, receipt_no: g.receipt_no, total_amount: ls.reduce((s, l) => s + l.qty * l.unit_price, 0), affects_stock: false, import_id: imp.id, created_by: ME.id });
      ls.forEach(l => S.sale_lines.push({ id: uuid(), sale_id: g.id, product_id: l.product_id, qty: l.qty, unit_price: l.unit_price })); });
    else if (kind === "retailer_sales") rows.forEach(r => S.retailer_sales.push({ id: uuid(), depot_id: r.depot_id, product_id: r.product_id, period_start: r.period_start, period_end: r.period_end, qty: r.qty, amount: r.amount, ending_stock: r.ending_stock, source: /pdf|png|jpe?g/i.test(filename) ? "pdf" : "excel", import_id: imp.id, created_by: ME.id, created_at: imp.created_at }));
    else if (kind === "stock_history") rows.forEach(r => S.snapshots.push({ id: uuid(), depot_id: r.depot_id, product_id: r.product_id, as_of: r.date, qty: r.qty, import_id: imp.id }));
    else if (kind === "deliveries_history") rows.forEach(r => S.delivery_history.push({ id: uuid(), depot_id: r.depot_id, product_id: r.product_id, qty: r.qty, requested_on: r.requested_on, received_on: r.received_on, ref: r.ref, import_id: imp.id }));
    else if (kind === "targets") rows.forEach(r => { S.targets = S.targets.filter(t => !(t.depot_id === r.depot_id && String(t.month).slice(0, 7) === r.month.slice(0, 7))); S.targets.push({ depot_id: r.depot_id, month: r.month, amount: r.amount, units: r.units, import_id: imp.id }); });
    else if (kind === "opening_stock") { const by = {}; rows.forEach(r => (by[r.depot_id] = by[r.depot_id] || []).push(r)); Object.entries(by).forEach(([d, ls]) => Engine.count({ id: uuid(), depot_id: d, note: "Opening balance import: " + filename, lines: ls.map(l => ({ product_id: l.product_id, counted_qty: l.qty })) })); }
  }
  bump();
}

  async act(id, action) {
    const r = S.requests.find(x => x.id === id), note = val("ap-note").trim() || null, odoo = val("ap-odoo").trim();
    let lines = null;
    if (action === "approve" || action === "dispatch") {
      // approved quantity, and how much of it comes from another plant (split supply)
      let bad = null;
      const ins = S.request_lines.filter(l => l.request_id === id).map(l => {
        const el = document.getElementById("apq-" + l.id), out = { id: l.id };
        const total = el ? Number(el.value) : (l.qty_approved ?? l.qty_requested);
        if (el && action === "approve") out.qty_approved = total;
        const parts = (S.plants || []).filter(p => p.id !== r.plant_id).map(p => [p.id, document.getElementById("aps-" + l.id + "-" + p.id)]).filter(x => x[1]);
        if (parts.length) {
          const sup = {}; let other = 0;
          parts.forEach(([k, inp]) => { const v = Number(inp.value || 0); if (v < 0 || isNaN(v)) bad = "Quantities can't be negative"; if (v > 0) { sup[k] = v; other += v; } });
          if (other > total) bad = "Split supply is more than the approved quantity for " + ((idx.product(l.product_id) || {}).sku || "an item");
          out.supply = other > 0 ? Object.assign({ [r.plant_id]: total - other }, sup) : null;
        }
        return Object.keys(out).length > 1 ? out : null;
      }).filter(Boolean);
      if (bad) return toast(bad, true);
      if (ins.length) lines = ins;
    }
    if (action === "reject" && !note) return toast("Add a remark explaining the rejection", true);
    if ($("#ap-odoo") && !odoo && ((r.status === "for_ppic" && odooRule() === "ppic_review") || (r.status === "approved" && odooRule() !== "off") && !r.odoo_ticket_ref)) return toast("Enter the Odoo ticket number first", true);
    const step = CHAIN.find(c => c.status === r.status);
    await busy(async () => {
      const confirm_id = ["reject", "return", "cancel"].includes(action) ? null : await Bio.confirm("advance:" + id + ":" + action, `${step.verb}: ${r.req_no} for ${(idx.depot(r.depot_id) || {}).name}.`);
      await API.run("advance", { request_id: id, action, note, lines, hatid_ref: val("ap-hatid").trim() || null, confirm_id, odoo_ref: odoo || null });
      const now = S.requests.find(x => x.id === id);
      toast({ approve: now.status === "approved" ? "Final approval given. PPIC can now dispatch." : "Sent to " + STATUS_LABEL[now.status], return: "Returned to previous step", reject: "Request rejected", dispatch: "Marked as dispatched", cancel: "Request cancelled" }[action]);
      rerender();
    });
  },

/* ---------- sign-in helpers ---------- */
function accessBlocked(u) {
  const st = accessState(u);
  if (st === "active") return false;
  AUTH.step = "blocked"; AUTH.msg = st === "suspended" ? { title: "Access suspended", body: "Your ShelfSync access has been suspended. Contact the ShelfSync admin or your agency coordinator." }
    : { title: "Access ended", body: "Your ShelfSync access ended on " + dshort(u.access_expires) + ". Contact the ShelfSync admin if you still need it." };
  if (MODE === "live" && SB) SB.auth.signOut();
  render(); return true;
}
/* Live "Continue with Google": the same sign-in as HATID and the Command Center.
   Google Identity Services hands the page an ID token; shelfsync-google-signin checks it with Google and that
   the email is on the ShelfSync list (Command Center › ShelfSync), then returns a one-time token we exchange
   for a session. Works for company accounts and personal Gmail (agency promodisers). */
let gisReady = false;
async function mountGoogle(tries = 0) {
  const box = document.getElementById("g-btn"); if (!box) return;
  try { if (!window.google || !google.accounts || !google.accounts.id) await loadScript("https://accounts.google.com/gsi/client"); }
  catch (e) { box.innerHTML = '<span class="small muted">Google sign-in didn\'t load. Check the connection and reload, or use email and password below.</span>'; return; }
  if (!window.google || !google.accounts || !google.accounts.id) { if (tries < 40) setTimeout(() => mountGoogle(tries + 1), 250); return; }
  if (!gisReady) { google.accounts.id.initialize({ client_id: liveConfig().googleClientId, callback: onGoogleCredential, auto_select: false, cancel_on_tap_outside: true, use_fedcm_for_prompt: true }); gisReady = true; }
  box.innerHTML = "";
  google.accounts.id.renderButton(box, { theme: "filled_blue", size: "large", shape: "pill", text: "continue_with", width: Math.min(320, box.clientWidth || 300) });
}
async function onGoogleCredential(resp) {
  const msg = t => { const m = document.getElementById("g-msg"); if (m) m.textContent = t || ""; };
  msg("Signing in…");
  await busy(async () => {
    let res = null;
    for (let i = 0; i < 3 && !res; i++) {
      try { res = await fetch(liveConfig().supabaseUrl + "/functions/v1/" + liveConfig().signinFunction, { method: "POST",
        headers: { "Content-Type": "application/json", apikey: liveConfig().supabaseAnonKey }, body: JSON.stringify({ credential: resp.credential }) }); }
      catch (e) { if (i < 2) await new Promise(r => setTimeout(r, 600 * 2 ** i)); }
    }
    if (!res) return msg("No connection — check your signal and try again.");
    const j = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (j.code === "not_registered" || j.code === "suspended" || j.code === "expired") { AUTH.step = "blocked"; AUTH.msg = { title: "No ShelfSync access", body: j.error }; render(); return; }
      return msg(j.error || "Sign-in failed — try again.");
    }
    const { error } = await SB.auth.verifyOtp({ token_hash: j.token_hash, type: "email" });
    if (error) return msg("Sign-in failed: " + error.message);
    msg(""); const prof = await liveProfile(); if (prof) await afterPassword(prof);
  });
}
async function liveProfile() {
  const { data } = await SB.auth.getUser(); if (!data || !data.user) return null;
  const { data: prof } = await SB.from("ss_profiles").select("*").eq("id", data.user.id).maybeSingle();
  if (!prof) { AUTH.step = "blocked"; AUTH.msg = { title: "No ShelfSync access", body: "This account hasn't been given access to ShelfSync. Ask your admin to add it in the Command Center.", email: data.user.email }; await SB.auth.signOut(); render(); return null; }
  return prof;
}
async function loadPasskeysAndSettings() {
  const [pk, st] = await Promise.all([SB.from("ss_passkeys").select("id,user_id,device_label,created_at,last_used_at"), SB.from("ss_settings").select("*")]);
  S = S || {}; S.users = S.users || []; S.passkeys = pk.data || []; S.settings = S.settings || {};
  (st.data || []).forEach(r => S.settings[r.key] = r.value);
}
async function afterPassword(u) {
  if (accessBlocked(u)) return;
  if (MODE === "live") await loadPasskeysAndSettings();
  const pol = bioPolicy();
  if (pol.login && u.require_passkey !== false) { AUTH.user = u; AUTH.step = Bio.has(u.id) ? "bio" : "enrol"; render(); return; }
  finishLogin(u, "login");
}
async function finishLogin(u, event) {
  sess.set(BIO_OK, u.id); LS.set("shelfsync-last-user", u.id);
  ME = withWorkingDepot(u); AUTH.step = "login"; AUTH.user = null; UI.route = null;
  if (MODE === "demo") { LS.set("shelfsync-demo-user", u.id); u.last_seen_at = new Date().toISOString(); try { Engine.logAccess({ event }); } catch (e) {} bump(); render(); window.scrollTo(0, 0); return; }
  try { await SB.rpc("ss_touch", { p_event: event, p_agent: navigator.userAgent }); } catch (e) {}
  try { await loadLive(); } catch (e) { toast("Couldn't load data: " + e.message, true); }
  startRealtime(); flushOutbox();
}
/* ---------- theme, install, boot ---------- */
function applyTheme() { if (UI.theme) document.documentElement.setAttribute("data-theme", UI.theme); else document.documentElement.removeAttribute("data-theme"); if (ME) rerender(); }
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; });
window.addEventListener("online", () => { renderSync(); flushOutbox(); });
window.addEventListener("offline", renderSync);
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
}

let realtime = null;
function startRealtime() {
  if (MODE !== "live" || realtime) return;
  let t = null; const refresh = () => { clearTimeout(t); t = setTimeout(() => loadLive(true).catch(() => {}), 600); };
  realtime = SB.channel("shelfsync");
  ["ss_messages", "ss_requests", "ss_documents", "ss_depot_reports"].forEach(table => realtime.on("postgres_changes", { event: "*", schema: "public", table }, refresh));
  realtime.subscribe();
}

/* restore a live session: still asks for Face ID / fingerprint once per app launch */
async function bootLive() {
  const { data } = await SB.auth.getSession();
  if (!data || !data.session) { ME = null; render(); return; }
  const prof = await liveProfile(); if (!prof) return;
  if (accessBlocked(prof)) return;
  if (sess.get(BIO_OK) === prof.id) { ME = withWorkingDepot(prof); try { await loadLive(); } catch (e) { toast(e.message, true); } startRealtime(); flushOutbox(); return; }
  await afterPassword(prof);
}

(async function boot() {
  applyTheme();
  if (await initLive()) {
    S = { users: [], passkeys: [], settings: {} }; render();
    try { await bootLive(); } catch (e) { toast(e.message, true); }
    SB.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT" && ME) { ME = null; render(); } });
    return;
  }
  MODE = "demo";
  S = LS.get(DEMO_KEY);
  if (!S || !S.products || !S.products.length || !S.capacity) { S = buildDemo(); persistDemo(); }
  const u = LS.get("shelfsync-demo-user"), user = u ? S.users.find(x => x.id === u) : null;
  if (user && sess.get(BIO_OK) === user.id && accessState(user) === "active") ME = withWorkingDepot(user);
  render();
})();
</script>
