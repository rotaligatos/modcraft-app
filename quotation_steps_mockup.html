<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modcraft — Quotation in two steps, light &amp; dark</title>
<style>
:root{--bg:#e8e6e1;--panel:#fff;--line:#e0ddd6;--ink:#1a1a1a;--ink2:#666;--navy:#1a3c5e;--teal:#0f6e56;--coral:#d85a30}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;background:var(--bg);color:var(--ink)}
button{font-family:inherit;font-size:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:.5px solid var(--line);
  padding:10px 18px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.bar h1{font-size:15px;font-weight:600;white-space:nowrap}
.lbl{font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.seg{display:inline-flex;background:#f4f4f2;border:.5px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{height:27px;padding:0 10px;border:none;border-radius:6px;background:transparent;color:var(--ink2);
  cursor:pointer;font-size:11.5px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stats{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:11px;color:var(--ink2)}
.stats b{display:block;font-size:15px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.15}
.stage{padding:16px;display:flex;justify-content:center;overflow:hidden}
/* The frame is the SIMULATED device width, which is often wider than the window
   you are viewing this in. It is scaled down to fit rather than left to hang off
   the side — otherwise you end up scrolling the mockup sideways and thinking the
   layout is broken when it is not. The scale factor is stated below the frame. */
/* width:100% matters — without it the shell stretches to the 1920px frame and
   then reports "plenty of room", so nothing scales and the frame is clipped
   instead. It must be bound by its parent, not by its child. */
.shell{width:100%;overflow:hidden}
.stage>div{width:100%;max-width:100%;min-width:0}
.frame{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  box-shadow:0 6px 22px rgba(0,0,0,.10);transform-origin:top left;transition:transform .2s}
.frame iframe{display:block;width:100%;height:660px;border:0}
.note{max-width:1080px;margin:0 auto 13px;font-size:12px;color:#4a4a46;line-height:1.6;background:var(--panel);
  border:.5px solid var(--line);border-left:2px solid #ba7517;border-radius:8px;padding:11px 14px}
.cap{text-align:center;font-size:11px;color:var(--ink2);padding:6px 0 0}
</style>
</head>
<body>

<div class="bar">
  <h1>Quotation — two steps</h1>
  <span class="lbl">Screen</span><div class="seg" id="sizes"></div>
  <span class="lbl">Theme</span>
  <div class="seg" role="group" aria-label="Theme">
    <button data-t="auto"  aria-pressed="true"  onclick="setTheme('auto')">Auto (device)</button>
    <button data-t="light" aria-pressed="false" onclick="setTheme('light')">Light</button>
    <button data-t="dark"  aria-pressed="false" onclick="setTheme('dark')">Dark</button>
  </div>
  <label style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);cursor:pointer">
    <input type="checkbox" id="leak" onchange="paint()" style="width:14px;height:14px">
    Show hardcoded colours
  </label>
  <div class="stats">
    <div>Step height<b id="s-h">—</b></div>
    <div>Scrolling<b id="s-s">—</b></div>
  </div>
</div>

<div class="stage"><div>
  <div class="note" id="note"></div>
  <div class="shell" id="shell"><div class="frame" id="frame" style="width:1440px"><iframe id="fr" title="Preview"></iframe></div></div>
  <div class="cap" id="cap"></div>
</div></div>

<script>
var SIZES=[{w:375,l:'Phone 375'},{w:768,l:'Tablet 768'},{w:1000,l:'Embed 1000'},
           {w:1280,l:'Laptop 1280'},{w:1440,l:'Desktop 1440'},{w:1920,l:'Wide 1920'}];
var size=1440, theme='auto', step=1;

/* ── the page under test ──────────────────────────────────────────────────
   Rendered into an iframe so media queries AND prefers-color-scheme both act
   on it for real. Two themes are defined at TOKEN level only — which is the
   whole point: everything styled through a token flips for free, and anything
   hardcoded does not. Tick "Show hardcoded colours" to see which is which. */
function CSS(){
  var leak=document.getElementById('leak').checked;
  return `
:root{
  --navy:#1a3c5e; --teal:#0f6e56; --amber:#ba7517; --coral:#d85a30; --muted:#888;
  --bg:#f4f4f2; --card:#fff; --border:#e0ddd6; --text:#1a1a1a; --text2:#666;
  --head:#fafaf8; --field:#fff; --fieldline:#ccc; --tint:#e9eef4;
}
${theme==='dark' ? darkTokens() : theme==='light' ? '' : '@media (prefers-color-scheme:dark){:root{'+darkTokens(true)+'}}'}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;
  background:var(--bg);color:var(--text);transition:background .2s,color .2s}
.top{height:44px;background:var(--card);border-bottom:.5px solid var(--border);display:flex;
  align-items:center;gap:6px;padding:0 12px;overflow-x:auto;white-space:nowrap}
.top .t{font-size:12px;color:var(--text2);padding:0 6px}
.top .t.on{color:var(--navy);font-weight:600}

/* ── wizard chrome ──────────────────────────────────────────────────────── */
.wiz{background:var(--card);border-bottom:.5px solid var(--border);padding:12px 16px}
.wizin{max-width:1560px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dots{display:flex;align-items:center;gap:8px}
.dot{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2)}
.dot i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;
  font-weight:700;background:var(--border);color:var(--text2);font-style:normal}
.dot.on i{background:var(--navy);color:#fff}
.dot.done i{background:var(--teal);color:#fff}
.dot.on span{color:var(--text);font-weight:600}
.rule{width:26px;height:1px;background:var(--border)}
.wtitle{font-size:13px;font-weight:600}
.wsub{font-size:11.5px;color:var(--text2)}
.nav{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:.5px solid var(--fieldline);
  border-radius:7px;background:var(--card);color:var(--text);cursor:pointer;font-size:13px}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}

.wrap{padding:14px;max-width:1560px;margin:0 auto}
.card{background:var(--card);border:.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;
  border-bottom:.5px solid var(--border);background:var(--head)}
.card-head h3{font-size:12.5px;font-weight:500}
.card-body{padding:14px}
.fld{font-size:10.5px;color:var(--text2);display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:0 9px;height:33px;border:.5px solid var(--fieldline);border-radius:6px;
  font-size:12.5px;font-family:inherit;background:var(--field);color:var(--text)}
.fw{margin-bottom:10px}
.pill{display:inline-flex;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;
  background:var(--tint);color:var(--navy)}
.sub{font-size:11.5px;color:var(--text2)}
.money{font-variant-numeric:tabular-nums}

/* Step 1 gets the room it needs; step 2 is the adaptive two-column layout. */
.f2{display:grid;grid-template-columns:1fr;gap:0}
.f3{display:grid;grid-template-columns:1fr;gap:0}
.grid{display:grid;gap:0 16px;align-items:start}
.items{display:grid;grid-template-columns:1fr 62px 74px 78px;gap:6px;align-items:center;margin-bottom:6px}
@media (min-width:640px){ .f2{grid-template-columns:1fr 1fr;gap:0 16px}
  .items{grid-template-columns:2fr 70px 84px 88px;gap:7px} }
@media (min-width:900px){ .f3{grid-template-columns:1fr 1fr 1fr;gap:0 16px} }
@media (min-width:1180px){ .grid{grid-template-columns:1.5fr 1fr} .s1grid{grid-template-columns:1fr 1fr;display:grid;gap:0 18px} }
@media (min-width:1560px){ .grid{grid-template-columns:1.45fr 1fr;gap:0 22px} }

${leak ? `
/* Anything painted with a literal instead of a token — this is what a
   half-finished dark mode looks like. 1,588 of these exist in index.html. */
.leak{background:#ffffff !important;color:#1a1a1a !important;border-color:#e0ddd6 !important}
.leak .card-head{background:#fafaf8 !important}
.leak .sub,.leak .fld{color:#666 !important}
.leak::after{content:"hardcoded #fff — stays light";position:absolute;top:6px;right:10px;
  font-size:9px;font-weight:700;color:#d85a30;letter-spacing:.03em}
.card.leak{position:relative;outline:2px dashed #d85a30}
` : ''}
`;}
function darkTokens(inner){
  var t=`
  --navy:#7fa8cd; --teal:#4fb397; --amber:#e0a83f; --coral:#ef8a5f; --muted:#8b8378;
  --bg:#191714; --card:#242220; --border:#38342e; --text:#f1eee9; --text2:#a39c92;
  --head:#2b2825; --field:#2b2825; --fieldline:#4a453e; --tint:#1f2c38;`;
  return inner ? t : ':root{'+t+'}';
}

function BODY(){
  var leak=document.getElementById('leak').checked;
  var tabs=['Dashboard','Quotation','Projects','Orders','Clients','Schedule','Reports','Approvals','Settings']
    .map(function(t,i){return '<span class="t'+(i===1?' on':'')+'">'+t+'</span>';}).join('');

  var wiz='<div class="wiz"><div class="wizin">'
    +'<div class="dots">'
      +'<span class="dot '+(step===1?'on':'done')+'"><i>'+(step===1?'1':'&#10003;')+'</i><span>Client</span></span>'
      +'<span class="rule"></span>'
      +'<span class="dot '+(step===2?'on':'')+'"><i>2</i><span>Quotation</span></span>'
    +'</div>'
    +'<div><div class="wtitle">'+(step===1?'Who is this quotation for?':'Build the quotation')+'</div>'
      +'<div class="wsub">'+(step===1
        ?'Filled once. You will not come back to this while pricing.'
        :'Alpha Corporation &middot; Direct &middot; Pasig City &middot; Kitchen fit-out — Tower B')+'</div></div>'
    +'<div class="nav">'
      +(step===2?'<button class="btn" onclick="parent.goStep(1)">&#8249; Client</button>':'')
      +(step===1?'<button class="btn btn-primary" onclick="parent.goStep(2)">Continue &#8250;</button>'
                :'<button class="btn btn-primary">Save draft</button>')
    +'</div></div></div>';

  if(step===1){
    return '<div class="top">'+tabs+'</div>'+wiz+'<div class="wrap">'
      +'<div class="s1grid">'
      +'<div>'+card('Client','<div class="f2">'
          +fld('Client name','Alpha Corporation')+fld('Business name','Alpha Corporation')
          +fld('Contact person','A. Reyes')+fld('Contact number','0917 000 0000')
          +fld('Email','orders@alphacorp.example')+sel('Segment','General Contractors')
        +'</div>'+sel('Account category','Direct')+'')+'</div>'
      +'<div>'+card('Project','<div class="fw"><label class="fld">Project name</label><input value="Kitchen fit-out — Tower B"></div>'
          +'<div class="f2">'+fld('Project location','Pasig City')+fld('City','Metro Manila')+'</div>'
          +'<div class="f3">'+sel('Service required','Fabrication with Installation')
          +sel('Pickup / Delivery','Delivery')+sel('Lead source','Referral')+'</div>')+'</div>'
      +'</div></div>';
  }

  var scope=card('Scope of work','<div style="font-weight:600;font-size:12.5px;margin-bottom:8px">Area 1 — Kitchen</div>'
    +item('Panel cutting','240','35','8,400.00')+item('Edgebanding EVA','310','28','8,680.00')
    +item('Boring 35mm (Hinges)','96','12','1,152.00')
    +'<div style="text-align:right;font-size:12px;margin-top:8px" class="sub">Area subtotal <b style="color:var(--text)">&#8369;18,232.00</b></div>','By cutting list');
  var pricing=card('Pricing adjustments', sel('VAT treatment','Vatable (12% inclusive)')+fld('Discount %','0'));
  var summary=card('Quotation summary', row('Fabrication','&#8369;18,232.00')+row('Fab. contingency (10%)','&#8369;1,823.20')
    +row('VAT (12%)','&#8369;2,406.62')
    +'<div style="border-top:.5px solid var(--border);margin-top:9px;padding-top:9px;display:flex;justify-content:space-between;align-items:center">'
    +'<span style="font-size:12.5px;font-weight:600">Grand total</span>'
    +'<span class="money" style="font-size:18px;font-weight:600;color:var(--navy)">&#8369;22,461.82</span></div>');
  var charges=card('Charges &amp; options', opt('Assembly',true)+opt('Cutting list charge',false)
    +opt('Design charge',false)+opt('Site visit',true)+opt('Bond &amp; Insurance',false));
  var rail=[charges,
    card('Project Size',fld('Components','310 detected')),
    card('Contingency &amp; charges',fld('Fabrication contingency %','10')),
    card('Scheduling &amp; timeline',fld('Fabrication start','2026-08-12')+fld('Installation start','2026-08-26')),
    // one card left deliberately hardcoded when the leak switch is on
    (leak?'<div class="card leak"><div class="card-head"><h3>Activity log</h3></div><div class="card-body"><div class="sub">Draft saved · 09:14</div></div></div>'
        : card('Activity log','<div class="sub">Draft saved · 09:14</div>'))
  ].join('');

  return '<div class="top">'+tabs+'</div>'+wiz+'<div class="wrap"><div class="grid">'
    +'<div>'+scope+pricing+summary+'</div><div>'+rail+'</div></div></div>';
}
function card(t,b,pill){return '<div class="card"><div class="card-head"><h3>'+t+'</h3>'
  +(pill?'<span class="pill">'+pill+'</span>':'')+'</div><div class="card-body">'+b+'</div></div>';}
function fld(l,v){return '<div class="fw"><label class="fld">'+l+'</label><input value="'+v+'"></div>';}
function sel(l,v){return '<div class="fw"><label class="fld">'+l+'</label><select><option>'+v+'</option></select></div>';}
function item(n,q,p,t){return '<div class="items"><input value="'+n+'"><input value="'+q+'"><input value="'+p+'"><div class="money" style="text-align:right;font-size:12px">'+t+'</div></div>';}
function row(l,v){return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0" class="sub"><span>'+l+'</span><b class="money" style="color:var(--text)">'+v+'</b></div>';}
function opt(n,on){return '<div style="display:flex;align-items:center;height:36px;border-bottom:.5px solid var(--border)">'
  +'<span style="flex:1;font-size:12.5px">'+n+'</span>'
  +'<span style="width:34px;height:20px;border-radius:11px;background:'+(on?'var(--teal)':'var(--border)')+';position:relative">'
  +'<span style="position:absolute;top:2px;left:'+(on?'16px':'2px')+';width:16px;height:16px;border-radius:50%;background:#fff"></span>'
  +'</span></div>';}

function paint(){
  var d=document.getElementById('fr').contentDocument;
  d.open();
  d.write('<!DOCTYPE html><html><head><meta charset="utf-8"><style>'+CSS()+'</style></head><body>'+BODY()+'</body></html>');
  d.close();
  setTimeout(readout,60);
}
/* Scale the frame so a 1920px simulation still fits whatever window you are
   using. The MEASUREMENTS are always taken from the frame's real simulated
   width, never the scaled-down pixels on screen. */
function fitFrame(){
  var shell=document.getElementById('shell'), frame=document.getElementById('frame');
  // measure the STAGE (the real constraint), never the shell — the shell can be
  // stretched by the very frame we are trying to fit inside it
  var stage=document.querySelector('.stage');
  var avail=Math.max(280,(stage?stage.clientWidth:window.innerWidth)-32);
  var scale=Math.min(1, avail/size);
  frame.style.transform = scale<1 ? 'scale('+scale+')' : 'none';
  shell.style.height = Math.round(662*scale)+'px';   // reserve the scaled height
  return scale;
}
function readout(){
  var fr=document.getElementById('fr'), d=fr.contentDocument;
  var h=Math.round(d.body.scrollHeight);
  var scale=fitFrame();
  document.getElementById('s-h').textContent=h.toLocaleString()+'px';
  document.getElementById('s-s').textContent=(h/660).toFixed(1)+'× screen';
  document.getElementById('cap').textContent='Step '+step+' of 2 · simulating '+size+'px · theme '+theme
    +(scale<1?' · shown at '+Math.round(scale*100)+'% to fit your window':'');
}
function goStep(n){ step=n; paint(); }
function setSize(w){ size=w; document.getElementById('frame').style.width=w+'px';
  [].forEach.call(document.querySelectorAll('#sizes button'),function(b){b.setAttribute('aria-pressed',+b.dataset.w===w);});
  fitFrame(); setTimeout(readout,60); }
window.addEventListener('resize',function(){ fitFrame(); readout(); });
function setTheme(t){ theme=t;
  [].forEach.call(document.querySelectorAll('[data-t]'),function(b){b.setAttribute('aria-pressed',b.dataset.t===t);});
  document.getElementById('note').innerHTML = t==='auto'
    ? '<b>Auto</b> follows the device — the same <code>prefers-color-scheme</code> your phone and Windows already set. '
      +'It flips only what is styled through a token. Tick <b>Show hardcoded colours</b> to see the other half of the problem.'
    : t==='dark'
    ? '<b>Dark, forced.</b> Every colour here comes from a token, so one block of overrides does the whole page. '
      +'In the real app 2,057 places use tokens and would flip like this — but 1,588 hardcoded colours would not.'
    : '<b>Light, forced.</b> A person who prefers light on a dark phone still gets light.';
  paint(); }
document.getElementById('sizes').innerHTML=SIZES.map(function(s){
  return '<button data-w="'+s.w+'" aria-pressed="'+(s.w===1440)+'" onclick="setSize('+s.w+')">'+s.l+'</button>';}).join('');
setTheme('auto'); setSize(1440);
</script>
</body>
</html>
