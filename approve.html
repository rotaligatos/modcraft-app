<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">

<link rel="icon" href="./icons/approvals/icon-192.png">
<!-- iOS ignores the manifest icons; this is what it uses on the home screen, and on iOS the app
     must BE on the home screen before it can receive a push at all (Safari 16.4+). -->

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Modcraft — Approve</title>
<style>
/* Mobile-first. Every tap target >= 44px -- the desktop Approvals page used 28-35px buttons,
   which is one of the reasons it was unusable on a phone. */
:root{
  --bg:#f6f7f9; --card:#fff; --card2:#f1f3f6; --border:#dfe3e8;
  --text:#111827; --text2:#6b7280; --navy:#1e3a5f; --teal:#0d9488;
  --amber:#d97706; --coral:#dc2626; --on-accent:#fff;
  --wash-navy:#eef2f7; --wash-amber:#fef3e2; --wash-teal:#e6f5f3;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --card:#131c2b; --card2:#1a2536; --border:#2a3648;
    --text:#e5e9f0; --text2:#9aa5b5; --navy:#4a7fb5;
    --wash-navy:#16233a; --wash-amber:#3a2c15; --wash-teal:#12332f;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 96px}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--navy);color:#fff;
  position:sticky;top:0;z-index:20}
.bar b{font-size:15px}
.bar .sp{margin-left:auto;font-size:12px;opacity:.85}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin-bottom:3px}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0}
.row+.row{border-top:1px solid var(--border)}
.row .k{color:var(--text2);font-size:13.5px}
.row .v{font-weight:600;text-align:right}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600}
.p-amber{background:var(--wash-amber);color:var(--amber)}
.p-teal{background:var(--wash-teal);color:var(--teal)}
.p-navy{background:var(--wash-navy);color:var(--navy)}
.btn{display:block;width:100%;min-height:52px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:16px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-ok{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-no{background:var(--card);border-color:var(--coral);color:var(--coral)}
.btn-go{background:var(--navy);border-color:var(--navy);color:#fff}
.btn:disabled{opacity:.45}
.slider{width:100%;height:44px;margin:6px 0}
.muted{color:var(--text2);font-size:12.5px}
/* The reason an approver gives. Optional — deciding is not justifying yourself to anyone — but
   when a request is rejected or countered it is the only thing that ever says why, and the
   requester is told it. The laptop has had this box since 2026-08-16; without it here the same
   decision was recorded or not depending on which device happened to be nearest. */
.rsn{width:100%;box-sizing:border-box;min-height:64px;resize:vertical;border-radius:10px;
  border:1px solid var(--border);background:var(--card);color:var(--text);padding:10px 12px;
  font:14px/1.4 inherit;margin-bottom:10px}
.err{background:var(--wash-amber);border:1px solid var(--amber);color:var(--amber);
  padding:12px;border-radius:12px;font-size:13.5px;margin-bottom:12px}
.hist{font-size:13px}
.hist .h{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.hist .h+.h{border-top:1px solid var(--border)}
.sk{height:14px;background:var(--card2);border-radius:6px;margin:8px 0;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.5}}
</style>
</head>
<body>
<div class="bar"><b>Modcraft</b><span class="sp" id="who">—</span></div>
<div class="wrap" id="root"><div class="card"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>

<!-- Loaded here, NOT in <head>. In the head it blocks parsing, so nothing painted at all
     -- not even the skeleton -- until ~120KB had downloaded. On a slow connection that is
     a white screen for seconds. Below the markup, the shell paints first and the library
     arrives while the user is already looking at something. Kept blocking (no defer)
     because the inline script below calls createClient at top level. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ───────────────────────────────────────────────────────────────────────────────
   Modcraft mobile approvals — Phase 1: the decision surface.

   WHY THIS IS A SEPARATE PAGE, NOT THE APP MADE RESPONSIVE
   Shrinking index.html was tried and rejected: even adapted, the volume of what
   the quotation page shows makes it useless on a phone. This page carries only
   what a decision needs. Everything else is Lami's job (Phase 3) -- she is a
   gateway you ask, not a narrator that reads at you.

   NO PRICING MATHS LIVES HERE, DELIBERATELY.
   The engine is in index.html. A second implementation would drift exactly the
   way recalc() and recalcFQ() do. Every figure below was computed by the real
   engine at request time and carried on the request (payload.decision), counter
   outcomes included -- a genuine 0-20% sweep, not interpolation.
   ─────────────────────────────────────────────────────────────────────────────── */
var SUPA_URL='https://nkpekroogqsmfilypowd.supabase.co';
var SUPA_ANON_KEY='sb_publishable_jpp6ZiFup3v0VVRJtjCOTQ_bF-SEpt4';
var supa=supabase.createClient(SUPA_URL,SUPA_ANON_KEY,{auth:{persistSession:true,detectSessionInUrl:true,flowType:'pkce'}});

/* Public half of the VAPID pair. Safe in the page — it is what the browser needs to create a
   subscription. The private half signs the push and lives only in a Supabase Edge Function
   secret; if it ever appears in this repo it must be regenerated, because this repo is public. */
var VAPID_PUBLIC_KEY='BOyJ46OOn0HByBwCXgadNFms0-qH_rudJkUL1U7I08WEabPcL653SzxeZ3g3bGNF8OWo9wGoPAU8HMupYAeo9WU';

var ME=null, MYROLE='', REQ=null, DEC=null, COUNTER=null, BUSY=false, SWREG=null;
/* OVR belongs here with the other cross-function state, not inside render(). It was declared
   `var OVR` inside render() yet read by onOverride() and act() — a ReferenceError in both.
   Invisible until now because each use sits behind `req_type==='override' &&`, which
   short-circuits for every other type: unlock, discount, non-VAT, premium and signature never
   evaluate it, so only an override approval from a phone ever threw. */
var OVR=null;
var el=function(id){return document.getElementById(id);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
function peso(n){ n=Number(n||0);
  return '₱'+n.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function reqIdFromUrl(){
  var m=/[?&]r=([^&#]+)/.exec(location.search)||/#(req_[^&]+)/.exec(location.hash);
  return m?decodeURIComponent(m[1]):'';
}
/* Same rule as the app: canViewCostReport(). Not a separate mobile permission model.
   Note this hides the figure, it does not protect it -- quotation_states RLS is
   company-scoped, so profit is already readable by anyone who can see the quotation.
   That exposure is pre-existing and tracked separately; this page does not widen it. */
function canSeeMoney(){ return MYROLE==='Admin'||MYROLE==='Director'||MYROLE==='Manager'; }

var TYPE_LABEL={nonvat:'Non-VAT treatment',discount:'Discount',override:'Cost factor adjustment',
                premium:'Holiday/weekend premium',unlock:'Unlock',signature:'Signature'};

/* The nine rates an override sets. Same keys and the same order as the laptop modal, so the two
   read alike; labels shortened for a narrow screen. */
var RATE_FIELDS=[
  {k:'fabContingency', l:'Fabrication contingency'},
  {k:'fabBuffer',      l:'Fabrication buffer'},
  {k:'mobContingency', l:'Mobilization contingency'},
  {k:'mobBuffer',      l:'Mobilization buffer'},
  {k:'mobMarkup',      l:'Mobilization markup'},
  {k:'instContingency',l:'Installation contingency'},
  {k:'instBuffer',     l:'Installation buffer'},
  {k:'instMarkup',     l:'Installation markup'},
  {k:'discountBuffer', l:'Discount buffer'}
];
/* The closed form the engine PROVED at request time -- see _apprOverrideModel in index.html.
   Kept deliberately identical to _ccfEval there; if one is ever changed the other must be, and
   the proof at request time is what catches it. */
function ovrEval(m,r){
  var pc=function(v){ return 1+(Number(v)||0)/100; };
  var fabC=m.regularBase*pc(r.fabContingency)*(m.ni?pc(r.fabBuffer):1);
  var mobC=m.mobBase*pc(r.mobContingency)*pc(r.mobBuffer)*pc(r.mobMarkup);
  var instC=m.instBase*pc(r.instContingency)*pc(r.instBuffer)*pc(r.instMarkup);
  // gated on installation, exactly as the engine does -- see _ccfEval in index.html
  var subtotal=(fabC+mobC+instC+m.otherFixed)*(m.ni?pc(r.discountBuffer):1);
  var preDisc=subtotal*(1+m.mssiRate+m.desRate);
  var afterDisc=preDisc*(1-(m.discPct||0)/100);
  var prem=afterDisc*m.premRate, vat=(afterDisc+prem)*m.vatRate;
  var grand=afterDisc+prem+vat, exVat=grand-vat;
  return {grand:grand, exVat:exVat, profit:exVat-m.cost,
          marginPct:(exVat>0?+((exVat-m.cost)/exVat*100).toFixed(2):0)};
}
function ovrRead(){
  var r={};
  RATE_FIELDS.forEach(function(f){
    var e=el('ov_'+f.k); r[f.k]=e?(parseFloat(e.value)||0):0;
  });
  return r;
}

/* ── THE AUTHORISATION SEAM ──────────────────────────────────────────────────────
   Phase 1 ships with this open: being signed in to Google on your own phone is the
   authority, and the action is still recorded against that identity so the audit
   trail is unchanged. Rommel has chosen PIN (option B) for Phase 1b, with biometric
   (WebAuthn) after that.

   The seam exists NOW so that later change touches one function and nothing else --
   not the surface, not the figures, not the data model.

   When B lands it must NOT mirror PIN hashes into Supabase. That copy existed, was
   never reliably populated, was read by nothing, and was deleted on 2026-08-08 after
   it caused two wrong conclusions. Verify against Google Sheet "User Roles" cols W/X
   live, through the existing Apps Script project -- same relay pattern as the mailer,
   for the same reason: one source of truth, nothing to go stale. */
/* One definition, used by every decision branch below, so the phone cannot end up with the box
   on some decisions and not others. Rendered fresh each time, so it never carries a previous
   request's text. */
function reasonBoxHtml(){
  return '<div class="lbl" style="margin-top:4px">Your reason <span style="text-transform:none;letter-spacing:0">(optional — kept on the record)</span></div>'
    +'<textarea class="rsn" id="rsn" maxlength="1000" placeholder="Why you approved, countered or rejected this…"></textarea>';
}
function authoriseAction(what){
  return Promise.resolve(true);   // Phase 1b replaces this body. Callers already await it.
}

/* ── Push notifications ─────────────────────────────────────────────────────────────────────
   Registered against approve.html specifically, NOT the whole site. sw.js has no fetch handler
   and must never gain one (see the note in that file), and the narrow scope means that even if
   the rule were broken the main app could not be served stale by it.
   Everything here degrades quietly: a browser without push, a blocked permission, or a failed
   subscribe leaves the surface fully usable. Push is an improvement on the notification, not
   the way in. */
function pushSupported(){
  return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
}
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function _swInit(){
  if(!('serviceWorker' in navigator)) return Promise.resolve(null);
  return navigator.serviceWorker.register('./sw.js',{scope:'./approve.html'})
    .then(function(reg){ SWREG=reg; return reg; })
    .catch(function(e){ console.warn('[push] worker did not register',e); return null; });
}
function _urlB64ToUint8(s){
  var pad='='.repeat((4-s.length%4)%4);
  var b=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));
  var out=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++) out[i]=b.charCodeAt(i);
  return out;
}
function pushCardHtml(){
  if(!pushSupported()){
    // iOS only exposes push once the app is on the home screen. Say so, rather than showing a
    // button that cannot work.
    if(isIOS()&&!isStandalone())
      return '<div class="card"><div class="lbl">Notifications</div>'
        +'<div class="muted">To get alerts on iPhone, add this to your Home Screen first — '
        +'tap Share, then <b>Add to Home Screen</b>, and open it from there.</div></div>';
    return '';
  }
  var p=(window.Notification&&Notification.permission)||'default';
  if(p==='granted') return '<div class="card" id="push-card"><div class="lbl">Notifications</div>'
    +'<div class="muted" id="push-msg">Checking…</div></div>';
  if(p==='denied') return '<div class="card"><div class="lbl">Notifications</div>'
    +'<div class="muted">Blocked for this site. Turn them back on in your browser settings for '
    +'this page if you want alerts.</div></div>';
  return '<div class="card" id="push-card"><div class="lbl">Notifications</div>'
    +'<div class="muted" style="margin-bottom:8px">Get told the moment a request needs you, '
    +'instead of checking.</div>'
    +'<button class="btn btn-go" id="push-on">Turn on notifications</button></div>';
}
function wirePushCard(){
  var btn=el('push-on');
  if(btn) btn.onclick=function(){ btn.disabled=true; enablePush(); };
  if(Notification.permission==='granted') refreshPushState();
}
function refreshPushState(){
  var m=el('push-msg'); if(!m) return;
  _swInit().then(function(reg){
    if(!reg){ m.textContent='Not available on this browser.'; return; }
    return reg.pushManager.getSubscription().then(function(sub){
      if(sub){ m.innerHTML='<span style="color:var(--teal)">On</span> — this device will be alerted.'; return; }
      m.innerHTML='Allowed, but this device is not subscribed yet. '
        +'<button class="btn" id="push-on2" style="min-height:44px;margin-top:8px">Subscribe</button>';
      var b=el('push-on2'); if(b) b.onclick=function(){ b.disabled=true; enablePush(); };
    });
  });
}
function enablePush(){
  if(!pushSupported()) return;
  Notification.requestPermission().then(function(p){
    if(p!=='granted'){ alert('Notifications were not allowed, so nothing will be sent to this device.'); return; }
    return _swInit().then(function(reg){
      if(!reg) throw new Error('no service worker');
      return reg.pushManager.subscribe({userVisibleOnly:true,
        applicationServerKey:_urlB64ToUint8(VAPID_PUBLIC_KEY)});
    }).then(function(sub){
      var j=sub.toJSON();
      // One row per endpoint. Upserting on endpoint means re-subscribing the same device
      // replaces its row instead of accumulating duplicates that would each get a copy.
      return supa.from('push_subscriptions').upsert({
        endpoint:j.endpoint, p256dh:j.keys&&j.keys.p256dh, auth:j.keys&&j.keys.auth,
        user_email:ME.trim().toLowerCase(),
        user_agent:(navigator.userAgent||'').slice(0,300)
      },{onConflict:'endpoint'});
    }).then(function(r){
      if(r&&r.error){ alert('Could not save this device. '+r.error.message); return; }
      var c=el('push-card');
      if(c) c.innerHTML='<div class="lbl">Notifications</div>'
        +'<div class="muted"><span style="color:var(--teal)">On</span> — this device will be alerted.</div>';
    });
  }).catch(function(e){ console.warn('[push] enable failed',e); alert('Could not turn on notifications. '+e); });
}

function boot(){
  // Register early and independently of sign-in: a device that already granted permission should
  // keep receiving pushes without waiting for anything here to succeed.
  _swInit();
  supa.auth.getSession().then(function(r){
    var s=r&&r.data&&r.data.session;
    if(!s){ renderSignIn(); return; }
    ME=s.user.email||'';
    el('who').textContent=ME;
    return supa.from('users').select('name,role,active').ilike('email',ME.trim()).limit(1)
      .then(function(u){
        var row=u&&u.data&&u.data[0];
        /* role comes from the users mirror, which IS reliable for role: it is only ever
           changed by an Admin save, which dual-writes. (Unlike pin_hash, which was
           user-driven from possibly-unconnected browsers -- hence its removal.) */
        MYROLE=row?(row.role||''):'';
        if(row&&row.active===false){ fail('Your account is not active. Ask an Admin.'); return; }
        loadRequest();
      });
  }).catch(function(e){ fail('Could not start a session. '+e); });
}
function renderSignIn(){
  el('root').innerHTML='<div class="card"><div class="lbl">Modcraft approvals</div>'
    +'<p class="muted">Sign in with your work Google account to review this request.</p>'
    +'<button class="btn btn-go" id="si">Sign in with Google</button></div>';
  el('si').onclick=function(){
    supa.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});
  };
}
function fail(msg){ el('root').innerHTML='<div class="err">'+esc(msg)+'</div>'; }

/* Installed from the home screen there is no ?r= — the app just opens. Showing "no request in
   the link" there would make the installed app useless, so with no id it lists what is actually
   waiting on you. Also the natural landing place after tapping a notification for a request that
   has since been actioned by someone else. */
function loadList(){
  el('root').innerHTML='<div class="card"><div class="lbl">Waiting on you</div>'
    +'<div class="sk"></div><div class="sk"></div></div>';
  supa.from('approval_requests')
    .select('id,req_type,serial,client_name,company,from_email,note,created_at,payload')
    .eq('status','pending').ilike('to_email',ME.trim())
    .order('created_at',{ascending:true}).limit(30)
    .then(function(r){
      if(r.error){ fail('Could not load your approvals. '+r.error.message); return; }
      var rows=r.data||[];
      var h='<div class="card"><div class="lbl">Waiting on you</div>';
      if(!rows.length){
        h+='<div style="padding:6px 0"><div style="font-size:16px;font-weight:600">Nothing waiting</div>'
          +'<div class="muted" style="margin-top:4px">You have no approval requests right now.</div></div>';
      } else {
        h+='<div class="muted" style="margin-bottom:8px">'+rows.length+' request'+(rows.length===1?'':'s')+'</div>';
        rows.forEach(function(x){
          var lbl=TYPE_LABEL[x.req_type]||'Request';
          if(x.req_type==='signature'&&x.payload&&x.payload.sigSlot)
            lbl+=' — '+(x.payload.sigSlot==='noted'?'Noted by':'Checked by');
          var age=Math.round((Date.now()-new Date(x.created_at).getTime())/3600000);
          h+='<a href="?r='+encodeURIComponent(x.id)+'" style="display:block;text-decoration:none;color:inherit;'
            +'border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;min-height:44px">'
            +'<span class="pill p-navy">'+esc(lbl)+'</span> '
            +'<span class="pill p-amber">'+(age<1?'just now':age+'h')+'</span>'
            +'<div style="font-weight:600;margin-top:8px">'+esc(x.client_name||'—')+'</div>'
            +'<div class="muted">'+esc(x.serial||'')+' · from '+esc((x.payload&&x.payload.from)||x.from_email||'')+'</div>'
            +(x.note?'<div class="muted" style="margin-top:4px">'+esc(x.note)+'</div>':'')
            +'</a>';
        });
      }
      h+='</div>';
      el('root').innerHTML=h+pushCardHtml();
      wirePushCard();
    });
}
function loadRequest(){
  var id=reqIdFromUrl();
  if(!id){ loadList(); return; }
  supa.from('approval_requests').select('*').eq('id',id).limit(1).then(function(r){
    if(r.error){ fail('Could not read that request. '+r.error.message); return; }
    REQ=r.data&&r.data[0];
    if(!REQ){ fail('That request was not found, or it belongs to a company you cannot see.'); return; }
    DEC=(REQ.payload&&REQ.payload.decision)||null;
    COUNTER=(DEC&&DEC.counter&&DEC.counter.length)?DEC.counter:null;
    render();
    loadHistory();
  });
}

function render(){
  var t=REQ.req_type||'', label=TYPE_LABEL[t]||'Request';
  var pending=(REQ.status==='pending');
  var mine=(REQ.to_email||'').trim().toLowerCase()===ME.trim().toLowerCase();
  var h='';

  h+='<div class="card">'
    +'<span class="pill p-navy">'+esc(label)+'</span> '
    +(pending?'<span class="pill p-amber">Pending</span>':'<span class="pill p-teal">'+esc(REQ.status)+'</span>')
    +'<div style="margin-top:10px" class="lbl">Client</div>'
    +'<div style="font-size:18px;font-weight:700">'+esc(REQ.client_name||'—')+'</div>'
    +'<div class="muted" style="margin-top:2px">'+esc(REQ.serial||'—')+' · '+esc(REQ.company||'')+'</div>'
    +'<div class="row"><span class="k">Requested by</span><span class="v">'
      +esc((REQ.payload&&REQ.payload.from)||REQ.from_email||'—')+'</span></div>'
    +(REQ.note?'<div class="row"><span class="k">Reason</span><span class="v" style="font-weight:500">'+esc(REQ.note)+'</span></div>':'')
    +'</div>';

  if(!DEC){
    /* Older requests predate the decision context. Say so plainly rather than showing
       an empty card that reads like "no impact". */
    h+='<div class="err">This request was raised before the figures were carried on it, '
      +'so there is nothing to show here. Open it on the laptop to see the impact.</div>';
  } else {
    var after=null;
    if(t==='discount'&&COUNTER){
      var want=Math.round(Number(REQ.payload.reqDisc||DEC.requested||0));
      after=COUNTER.find(function(x){return x.p===want;})||null;
    }
    h+='<div class="card">'
      +'<div class="lbl">Quotation total</div><div class="big">'+peso(DEC.before)+'</div>';
    if(after){
      h+='<div class="row"><span class="k">If approved at '+esc(DEC.requested)+'%</span>'
        +'<span class="v">'+peso(after.grand)+'</span></div>'
        +'<div class="row"><span class="k">Reduction</span><span class="v" style="color:var(--coral)">−'
        +peso(DEC.before-after.grand)+'</span></div>';
    }
    h+='<div class="row"><span class="k">Project size</span><span class="v">'
      +esc(DEC.projectSize||'—')+' components</span></div>';
    if(canSeeMoney()){
      h+='<div class="row"><span class="k">Project cost</span><span class="v">'+peso(DEC.cost)+'</span></div>'
        +'<div class="row"><span class="k">Profit'+(after?' if approved':'')+'</span><span class="v">'
        +peso(after?after.profit:DEC.profit)+' <span class="muted">('
        +(after?after.marginPct:DEC.marginPct)+'%)</span></span></div>';
    }
    if(DEC.discScope) h+='<div class="row"><span class="k">Applies to</span><span class="v">'+esc(DEC.discScope)+' only</span></div>';
    h+='</div>';
  }

  h+='<div class="card" id="hist"><div class="lbl">Client history</div>'
    +'<div class="sk"></div><div class="sk"></div></div>';

  /* A cost-factor override is approved by ENTERING nine rates -- the requester sends only a
     reason, by design. So this page gives the rate editor, with the total and margin moving as
     they change, evaluated from a model the engine PROVED at request time. Where that proof
     failed there is no model, and the honest answer is a laptop. */
  OVR=(DEC&&DEC.override)||null;   // assigns the shared one — see the declaration up top
  var overrideNeedsLaptop=(t==='override'&&!OVR);

  if(pending&&mine&&overrideNeedsLaptop){
    h+='<div class="card"><div class="lbl">Your decision</div>'
      +'<p class="muted">The figures for this one could not be worked out reliably away from the '
      +'app, so setting the rates has to be done on a laptop. You can still decline it now.</p>'
      +reasonBoxHtml()
      +'<button class="btn btn-no" id="no">Reject</button>'
      +'<div class="muted" style="margin-top:10px">Recorded against '+esc(ME)+'.</div></div>';
  } else if(pending&&mine&&t==='override'){
    h+='<div class="card"><div class="lbl">Set the cost factors</div>'
      +'<div id="ovrimp" class="row" style="border:0;padding:2px 0 8px"></div>';
    RATE_FIELDS.forEach(function(f){
      h+='<div class="row"><span class="k">'+esc(f.l)+'</span>'
        +'<span class="v"><input class="num" type="number" inputmode="decimal" step="0.5" '
        +'id="ov_'+f.k+'" value="'+(OVR.current[f.k]||0)+'"> %</span></div>';
    });
    h+='<button class="btn" id="ovreset" style="min-height:44px;font-size:14px">Reset to current rates</button>'
      +reasonBoxHtml()+'<button class="btn btn-ok" id="ok">Approve these rates</button>'
      +'<button class="btn btn-no" id="no">Reject</button>'
      +'<div class="muted" style="margin-top:10px">Recorded against '+esc(ME)+'.</div></div>';
  } else if(pending&&mine){
    h+='<div class="card"><div class="lbl">Your decision</div>';
    if(t==='discount'&&COUNTER){
      var reqd=Math.round(Number(REQ.payload.reqDisc||DEC.requested||0));
      h+='<div class="row" style="border:0;padding-top:2px"><span class="k">Counter at</span>'
        +'<span class="v"><span id="cv">'+reqd+'</span>%</span></div>'
        +'<input class="slider" type="range" min="0" max="'+(COUNTER.length-1)+'" value="'+reqd+'" id="cs">'
        +'<div id="cimp" class="muted"></div>';
    }
    h+=reasonBoxHtml();
    h+='<button class="btn btn-ok" id="ok">Approve</button>'
      +(t==='discount'&&COUNTER?'<button class="btn" id="ctr">Send counter-offer</button>':'')
      +'<button class="btn btn-no" id="no">Reject</button>'
      +'<div class="muted" style="margin-top:10px">Recorded against '+esc(ME)+'.</div>'
      +'</div>';
  } else if(pending&&!mine){
    h+='<div class="card"><div class="muted">This request is with '
      +esc(REQ.to_email||'someone else')+'. You are seeing it read-only.</div></div>';
  } else {
    h+='<div class="card"><div class="muted">Already '+esc(REQ.status)
      +(REQ.actioned_by?' by '+esc(REQ.actioned_by):'')+'. Nothing to do.</div></div>';
  }

  el('root').innerHTML=h+pushCardHtml();
  wirePushCard();

  var cs=el('cs');
  if(cs){ cs.oninput=onCounter; onCounter(); }
  if(OVR&&el('ov_fabContingency')){
    RATE_FIELDS.forEach(function(f){ var e=el('ov_'+f.k); if(e) e.oninput=onOverride; });
    el('ovreset').onclick=function(){
      RATE_FIELDS.forEach(function(f){ var e=el('ov_'+f.k); if(e) e.value=OVR.current[f.k]||0; });
      onOverride();
    };
    onOverride();
  }
  if(el('ok'))  el('ok').onclick =function(){ act('approved'); };
  if(el('no'))  el('no').onclick =function(){ act('rejected'); };
  if(el('ctr')) el('ctr').onclick=function(){ act('countered'); };
}

/* Live figures as the counter moves -- read straight from the table the engine built.
   No arithmetic here on purpose: interpolating would be wrong wherever a minimum
   charge or a scoped discount bends the curve. */
function onCounter(){
  var cs=el('cs'); if(!cs||!COUNTER) return;
  var row=COUNTER[Number(cs.value)]; if(!row) return;
  el('cv').textContent=row.p;
  var s='New total '+peso(row.grand)+' · saves '+peso(DEC.before-row.grand);
  if(canSeeMoney()) s+=' · margin '+row.marginPct+'%';
  el('cimp').textContent=s;
}

/* Live as the rates are typed. Shows the movement against the current total, because "what does
   this change" is the actual question -- not the absolute number. */
function onOverride(){
  var box=el('ovrimp'); if(!box||!OVR) return;
  var r=ovrEval(OVR,ovrRead());
  var delta=r.grand-DEC.before;
  var sign=delta>=0?'+':'−';
  var col=delta>=0?'var(--teal)':'var(--coral)';
  var s='<span class="k">New total</span><span class="v">'+peso(r.grand)
       +' <span style="color:'+col+'">('+sign+peso(Math.abs(delta)).slice(1)+')</span></span>';
  box.innerHTML=s;
  var mg=el('ovrmargin');
  if(!mg){
    mg=document.createElement('div'); mg.className='row'; mg.id='ovrmargin';
    mg.style.cssText='border:0;padding:0 0 8px';
    box.parentNode.insertBefore(mg,box.nextSibling);
  }
  mg.innerHTML=canSeeMoney()
    ? '<span class="k">Profit</span><span class="v">'+peso(r.profit)+' <span class="muted">('+r.marginPct+'%)</span></span>'
    : '';
}
function loadHistory(){
  var name=(REQ.client_name||'').trim();
  var box=el('hist'); if(!box) return;
  if(!name){ box.innerHTML='<div class="lbl">Client history</div><div class="muted">No client name.</div>'; return; }
  supa.from('quotations').select('serial,created_at,total,status')
    .ilike('client_name',name).order('created_at',{ascending:false}).limit(6)
    .then(function(r){
      if(r.error||!r.data){ box.innerHTML='<div class="lbl">Client history</div><div class="muted">Could not load.</div>'; return; }
      var rows=r.data.filter(function(x){return x.serial!==REQ.serial;});
      var won=rows.filter(function(x){return /client approved/i.test(x.status||'');}).length;
      var val=rows.reduce(function(a,x){return a+Number(x.total||0);},0);
      var h='<div class="lbl">Client history</div>';
      if(!rows.length){ h+='<div class="muted">First quotation for this client.</div>'; }
      else{
        h+='<div class="row" style="border:0;padding-top:2px"><span class="k">'+rows.length
          +' previous</span><span class="v">'+peso(val)+' · '+won+' won</span></div><div class="hist">';
        rows.forEach(function(x){
          h+='<div class="h"><span class="muted">'+esc((x.created_at||'').slice(0,10))+' '+esc(x.serial)
            +'</span><span>'+peso(x.total)+'</span></div>';
        });
        h+='</div>';
      }
      box.innerHTML=h;
    });
}

function act(status){
  if(BUSY) return;
  var counter=null;
  if(status==='countered'){
    var cs=el('cs'); if(!cs){ return; }
    counter=COUNTER[Number(cs.value)].p;
  }
  var word=status==='approved'?'Approve':status==='rejected'?'Reject':('Counter at '+counter+'%');
  if(!confirm(word+' this request?')) return;
  BUSY=true;
  ['ok','no','ctr'].forEach(function(i){ if(el(i)) el(i).disabled=true; });

  authoriseAction(status).then(function(okToProceed){
    if(!okToProceed){ BUSY=false; render(); return; }
    var patch={status:status,actioned_by:ME,updated_at:new Date().toISOString()};
    if(counter!=null) patch.counter_disc=counter;
    /* The approver's reason, into the SAME field the app reads (payload.actionReason), so a
       decision made on a phone reads identically to one made on a laptop -- on the Approvals
       card, in the message the requester gets, and in the activity log.
       Object.assign, never a fresh object: this is a partial patch and the payload already
       carries decision/cfValues/sigSlot. Replacing it wholesale is precisely how sigSlot was
       lost and to_email came back null. */
    var _rsn=(el('rsn')&&el('rsn').value||'').trim();
    if(_rsn){
      var payR=Object.assign({},REQ.payload||{});
      payR.actionReason=_rsn;
      patch.payload=payR;
    }
    /* An override IS its rates -- approving without them would mark the request done while the
       quotation kept the old ones, which is the failure this whole phase exists to prevent.
       They ride in the payload, where _persistApprovedFieldToQuotation reads cfValues from. */
    if(status==='approved'&&REQ.req_type==='override'&&OVR){
      /* Builds on patch.payload when the reason above already set it -- starting from REQ.payload
         again would drop the reason on exactly the request type that most needs one. */
      var pay=Object.assign({},patch.payload||REQ.payload||{});
      pay.cfValues=ovrRead();
      patch.payload=pay;
    }
    return supa.from('approval_requests').update(patch).eq('id',REQ.id).then(function(r){
      BUSY=false;
      if(r.error){
        alert('Could not save that. '+r.error.message);
        ['ok','no','ctr'].forEach(function(i){ if(el(i)) el(i).disabled=false; });
        return;
      }
      REQ.status=status; REQ.actioned_by=ME; if(counter!=null) REQ.counter_disc=counter;
      render(); loadHistory();
      /* A counter is an OFFER -- nothing changes on the quotation until the requester
         accepts it. Saying so here is the fix for the single most common support
         question this flow produces. */
      if(status==='countered') alert('Counter sent. Nothing changes on the quotation until '
        +((REQ.payload&&REQ.payload.from)||'the requester')+' accepts it.');
    });
  }).catch(function(e){
    BUSY=false; alert('Something went wrong. '+e);
    ['ok','no','ctr'].forEach(function(i){ if(el(i)) el(i).disabled=false; });
  });
}

boot();
</script>
</body>
</html>
