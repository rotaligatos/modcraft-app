<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Command Center</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --card2:#f7f9fb; --line:#dde3ea; --text:#15202e; --text2:#5b6878;
  --navy:#12233d; --accent:#1f5fa8; --on-accent:#fff; --teal:#11746c; --amber:#8a5a00; --coral:#b33a2f;
  --wash-amber:#fff4de; --wash-teal:#e3f4f1; --wash-coral:#fde8e5; --wash-blue:#e7eff9;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1318; --card:#171c23; --card2:#1d232b; --line:#2b333d; --text:#e6ebf1; --text2:#9aa6b4;
    --navy:#c9d6e6; --accent:#7fb0ea; --on-accent:#0f1318; --teal:#6fd3c4; --amber:#f1c36b; --coral:#ff9b90;
    --wash-amber:#2c2413; --wash-teal:#12302c; --wash-coral:#351b19; --wash-blue:#16273b;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;color:var(--navy)}
header .who{margin-left:auto;font-size:12px;color:var(--text2);text-align:right}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
nav button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.wrap{max-width:1700px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 8px;color:var(--navy)}
.sub{color:var(--text2);font-size:12.5px;margin:0 0 10px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text2);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.off td{opacity:.55}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
button.btn{font:inherit;cursor:pointer;border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:var(--card2);color:var(--text)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-none{color:var(--text2);border:1px dashed var(--line)}
.p-on{background:var(--wash-teal);color:var(--teal)}
.p-adm{background:var(--wash-blue);color:var(--accent)}
.p-off{background:var(--wash-coral);color:var(--coral)}
.chk{display:inline-flex;gap:4px;align-items:center;margin:2px 10px 2px 0;font-size:12.5px;white-space:nowrap}
.note{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px}
.note.warn{background:var(--wash-amber);color:var(--amber)}
.note.err{background:var(--wash-coral);color:var(--coral)}
.grid-add{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;align-items:end}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.muted{color:var(--text2)}
.caps{display:flex;flex-wrap:wrap;gap:2px 0;min-width:340px;max-width:520px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:var(--card);padding:10px 16px;border-radius:9px;font-size:13px;display:none;z-index:9}
.stat{display:inline-block;margin-right:22px}
.stat b{display:block;font-size:22px;color:var(--navy)}
</style>
</head>
<body>
<header>
  <h1>Command Center</h1>
  <nav id="nav"></nav>
  <div class="who" id="who"></div>
</header>
<div class="wrap" id="root"><div class="card">Loading…</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ─────────────────────────────────────────────────────────────────────────────
   Command Center — one place to manage who may use each app.

   Each app keeps its OWN user list, because the people differ:
     Modcraft  — sales/estimating. Users live in the User Roles Google Sheet (PINs too),
                 so they are shown here READ-ONLY and still managed in Modcraft.
     KEYSTONE  — admin staff. keystone_users + capabilities (adm_user_caps).
     PMES      — production staff. pmes_users: operator / supervisor / manager / admin,
                 operators optionally limited to stations.

   Who may open this page: Modcraft Admin/Director (cc_me().allowed). Every change to the
   KEYSTONE and PMES lists is written to user_access_log by a database trigger, and the
   database refuses any change that would leave a list with no active admin.
   ───────────────────────────────────────────────────────────────────────────── */
var SUPA_URL='https://nkpekroogqsmfilypowd.supabase.co';
var SUPA_ANON_KEY='sb_publishable_jpp6ZiFup3v0VVRJtjCOTQ_bF-SEpt4';
var supa=supabase.createClient(SUPA_URL,SUPA_ANON_KEY,{auth:{persistSession:true,detectSessionInUrl:true,flowType:'pkce'}});

var COMPANIES=['World Class Laminate, Inc.','Module Systems and Services, Inc.','Cebu World Laminate, Inc.'];
var CO_KEYS=[['wcl','WCL'],['mssi','MSSI'],['cwl','CWL']];
var KS_ROLES=['Admin','Director','Manager','Supervisor','Approver','Encoder','Staff','Viewer'];
var PMES_ROLES=['operator','supervisor','manager','admin'];
var CAPS=[['can_request','Request'],['can_approve','Approve'],['can_vouch','Vouch'],['can_release','Release'],
          ['can_source','Source'],['is_manager_approver','Mgr approver'],['is_hpo_approver','HPO approver'],['is_md_approver','MD approver']];
var TABS=[['people','People'],['pmes','PMES users'],['ks','KEYSTONE users'],['log','Change log']];

var ME=null, TAB='people', D={modcraft:[],ks:[],pmes:[],caps:[],stages:[],log:[]};

function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(e){return String(e||'').trim().toLowerCase()}
function toast(m){var t=el('toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display='none'},3200)}
function fmt(iso){if(!iso)return '—';var d=new Date(iso);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function validEmail(e){return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)}
function dbErr(e){
  var m=(e&&e.message)||String(e);
  if(/At least one active admin/.test(m)) return 'Refused: that would leave the list with no active admin.';
  if(e&&e.code==='23505') return 'That email is already on the list.';
  return m;
}

async function boot(){
  var s=await supa.auth.getSession();
  if(!s.data.session) return signIn();
  var r=await supa.rpc('cc_me');
  if(r.error) return fatal('Could not check your account: '+esc(r.error.message));
  ME=r.data||{};
  el('who').innerHTML='<b>'+esc(ME.name||ME.email)+'</b><br>'+esc(ME.email)+
    ' · <a href="#" onclick="supa.auth.signOut().then(function(){location.reload()});return false">Sign out</a>';
  if(!ME.allowed) return fatal('<b>'+esc(ME.email)+'</b> is not a Modcraft Admin or Director, so the Command Center is closed to this account.');
  await loadAll();
  drawNav(); draw();
}
function signIn(){
  el('root').innerHTML='<div class="card" style="max-width:440px;margin:40px auto;text-align:center">'+
    '<h2>Command Center</h2><p class="sub">Sign in with your company Google account.</p>'+
    '<button class="btn primary" onclick="supa.auth.signInWithOAuth({provider:\'google\',options:{redirectTo:location.origin+location.pathname}})">Sign in with Google</button></div>';
}
function fatal(html){el('root').innerHTML='<div class="card"><div class="note err">'+html+'</div></div>'}

async function loadAll(){
  var q=await Promise.all([
    supa.from('users').select('email,name,role,company,active'),
    supa.from('keystone_users').select('*').order('active',{ascending:false}).order('name'),
    supa.from('pmes_users').select('*').order('active',{ascending:false}).order('name'),
    supa.from('adm_user_caps').select('*'),
    supa.from('pmes_stage_types').select('code,label,sort_order').order('sort_order'),
    supa.from('user_access_log').select('*').order('at',{ascending:false}).limit(300)
  ]);
  var bad=q.filter(function(x){return x.error});
  if(bad.length) toast('Some lists could not load: '+bad[0].error.message);
  D.modcraft=q[0].data||[]; D.ks=q[1].data||[]; D.pmes=q[2].data||[];
  D.caps=q[3].data||[]; D.stages=q[4].data||[]; D.log=q[5].data||[];
}

function drawNav(){
  el('nav').innerHTML=TABS.map(function(t){
    return '<button class="'+(TAB===t[0]?'on':'')+'" onclick="TAB=\''+t[0]+'\';drawNav();draw()">'+t[1]+'</button>'}).join('');
}
function draw(){
  var fn={people:viewPeople,pmes:viewPmes,ks:viewKs,log:viewLog}[TAB];
  try{ el('root').innerHTML=fn(); }catch(e){ fatal('This view failed: '+esc(e.message)); console.error(e); }
}

/* ── People: everyone, across all three apps ─────────────────────────────── */
function rolePill(row,isAdmin){
  if(!row) return '<span class="pill p-none">—</span>';
  if(row.active===false) return '<span class="pill p-off">'+esc(row.role)+' · off</span>';
  return '<span class="pill '+(isAdmin?'p-adm':'p-on')+'">'+esc(row.role)+'</span>';
}
function viewPeople(){
  var map={};
  function add(list,key){list.forEach(function(r){var e=norm(r.email);if(!e)return;
    map[e]=map[e]||{email:e,name:''};map[e][key]=r;if(!map[e].name&&r.name)map[e].name=r.name})}
  add(D.modcraft,'mc'); add(D.ks,'ks'); add(D.pmes,'pm');
  var rows=Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return (a.name||a.email).localeCompare(b.name||b.email)});
  var act=function(l){return l.filter(function(r){return r.active!==false}).length};
  return '<div class="card"><span class="stat"><b>'+act(D.modcraft)+'</b>Modcraft</span>'+
    '<span class="stat"><b>'+act(D.ks)+'</b>KEYSTONE</span><span class="stat"><b>'+act(D.pmes)+'</b>PMES</span>'+
    '<p class="sub" style="margin-top:10px">Modcraft users are shown read-only — they are managed in Modcraft → Settings → Users '+
    '(the User Roles sheet, where their PINs live). Use the buttons to give someone KEYSTONE or PMES access.</p></div>'+
    '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Modcraft</th><th>KEYSTONE</th><th>PMES</th><th></th></tr></thead><tbody>'+
    rows.map(function(p){
      var ksAdm=p.ks&&(p.ks.role==='Admin'||p.ks.role==='Director');
      return '<tr><td>'+esc(p.name||'—')+'</td><td class="mono">'+esc(p.email)+'</td>'+
        '<td>'+rolePill(p.mc,p.mc&&(p.mc.role==='Admin'||p.mc.role==='Director'))+'</td>'+
        '<td>'+rolePill(p.ks,ksAdm)+'</td><td>'+rolePill(p.pm,p.pm&&p.pm.role==='admin')+'</td><td style="white-space:nowrap">'+
        (!p.ks?'<button class="btn" onclick="quickAdd(\'ks\',\''+esc(p.email)+'\')">+ KEYSTONE</button> ':'')+
        (!p.pm?'<button class="btn" onclick="quickAdd(\'pmes\',\''+esc(p.email)+'\')">+ PMES</button>':'')+
        '</td></tr>'}).join('')+'</tbody></table></div></div>';
}
function quickAdd(app,email){
  var mc=D.modcraft.find(function(u){return norm(u.email)===email})||{};
  TAB=app; drawNav(); draw();
  var f=el(app==='ks'?'ksNewEmail':'pmNewEmail'); if(f){f.value=email;}
  var n=el(app==='ks'?'ksNewName':'pmNewName'); if(n&&mc.name){n.value=mc.name;}
  if(app==='ks'&&mc.company){var c=el('ksNewCo'); if(c) c.value=COMPANIES.find(function(x){return coKey(x)===coKey(mc.company)})||'';}
  (n||f).focus(); (n||f).scrollIntoView({block:'center'});
}
function coKey(c){c=String(c||'').toLowerCase();if(!c.trim())return '';return c.indexOf('cebu')>=0?'cwl':c.indexOf('module')>=0?'mssi':'wcl'}

/* ── PMES users ───────────────────────────────────────────────────────────── */
function stationBoxes(sel,cls){
  return D.stages.map(function(s){return '<label class="chk" title="'+esc(s.label)+'"><input type="checkbox" class="'+cls+'" value="'+esc(s.code)+'"'+
    (sel.indexOf(s.code)>=0?' checked':'')+'>'+esc(s.code)+'</label>'}).join('');
}
function viewPmes(){
  return '<div class="card"><h2>PMES users — production staff</h2>'+
    '<p class="sub"><b>Operator</b>: scan and log work, only at ticked stations (none ticked = any). '+
    '<b>Supervisor</b>: all stations, jobs, job materials, packing. <b>Manager</b>: + setup lists, machines, standards. '+
    '<b>Admin</b>: + manage Production users (also from PMES → Setup).</p>'+
    '<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Stations (operators)</th><th>Active</th><th>Notes</th><th></th></tr></thead><tbody>'+
    D.pmes.map(function(u,i){
      return '<tr class="'+(u.active?'':'off')+'" id="pm-'+i+'"><td><input class="f-name" value="'+esc(u.name)+'"></td>'+
      '<td class="mono">'+esc(u.email)+'</td><td><select class="f-role">'+PMES_ROLES.map(function(r){return '<option'+(r===u.role?' selected':'')+'>'+r+'</option>'}).join('')+'</select></td>'+
      '<td>'+stationBoxes(u.stations||[],'f-st')+'</td><td><input type="checkbox" class="f-act"'+(u.active?' checked':'')+'></td>'+
      '<td><input class="f-notes" value="'+esc(u.notes)+'"></td>'+
      '<td><button class="btn primary" onclick="savePmes('+i+')">Save</button></td></tr>'}).join('')+
    '</tbody></table></div></div>'+
    '<div class="card"><h2>Add a PMES user</h2><div class="grid-add">'+
    '<div><div class="sub">Email</div><input id="pmNewEmail" placeholder="name@worldclasslaminate.com.ph" style="width:100%"></div>'+
    '<div><div class="sub">Name</div><input id="pmNewName" style="width:100%"></div>'+
    '<div><div class="sub">Role</div><select id="pmNewRole" style="width:100%">'+PMES_ROLES.map(function(r){return '<option>'+r+'</option>'}).join('')+'</select></div>'+
    '<div><button class="btn primary" onclick="addPmes()">Add user</button></div></div>'+
    '<div class="sub" style="margin-top:10px">Stations (operators only)</div><div id="pmNewSt">'+stationBoxes([],'f-st')+'</div></div>';
}
function picked(root,cls){return [].slice.call(root.querySelectorAll('input.'+cls+':checked')).map(function(c){return c.value})}
async function savePmes(i){
  var u=D.pmes[i], tr=el('pm-'+i);
  var patch={name:tr.querySelector('.f-name').value.trim(),role:tr.querySelector('.f-role').value,
    stations:picked(tr,'f-st'),active:tr.querySelector('.f-act').checked,notes:tr.querySelector('.f-notes').value.trim()};
  var r=await supa.from('pmes_users').update(patch).eq('email',u.email).select();
  if(r.error) return toast(dbErr(r.error));
  if(!r.data||!r.data.length) return toast('Not saved — the database refused the change.');
  toast('Saved '+u.email); await refresh();
}
async function addPmes(){
  var e=norm(el('pmNewEmail').value); if(!validEmail(e)) return toast('Enter a valid email.');
  var r=await supa.from('pmes_users').insert({email:e,name:el('pmNewName').value.trim(),role:el('pmNewRole').value,stations:picked(el('pmNewSt'),'f-st')});
  if(r.error) return toast(dbErr(r.error));
  toast('Added '+e+' to PMES'); await refresh();
}

/* ── KEYSTONE users + capabilities ───────────────────────────────────────── */
function capsOf(email){return D.caps.find(function(c){return norm(c.email)===email})||{}}
function viewKs(){
  return '<div class="card"><h2>KEYSTONE users — admin staff</h2>'+
    '<p class="sub">Role and company decide what each person sees (Admin/Director see every company; a Manager with “All companies” too). '+
    'Capabilities decide what they may do. Admin/Director already hold every operational capability; approver roles are always explicit.</p>'+
    '<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Company</th><th>Also sees</th><th>All cos.</th><th>Capabilities</th><th>Limits (₱)</th><th>Active</th><th></th></tr></thead><tbody>'+
    D.ks.map(function(u,i){
      var c=capsOf(u.email);
      return '<tr class="'+(u.active?'':'off')+'" id="ks-'+i+'"><td><input class="f-name" value="'+esc(u.name)+'"></td>'+
      '<td class="mono">'+esc(u.email)+'</td>'+
      '<td><select class="f-role">'+KS_ROLES.map(function(r){return '<option'+(r===u.role?' selected':'')+'>'+r+'</option>'}).join('')+'</select></td>'+
      '<td><select class="f-co"><option value="">—</option>'+COMPANIES.map(function(x){return '<option'+(coKey(x)===coKey(u.company)?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></td>'+
      '<td style="white-space:nowrap">'+CO_KEYS.map(function(k){return '<label class="chk"><input type="checkbox" class="f-acc" value="'+k[0]+'"'+((u.access_companies||[]).indexOf(k[0])>=0?' checked':'')+'>'+k[1]+'</label>'}).join('')+'</td>'+
      '<td><input type="checkbox" class="f-all"'+(u.receive_all?' checked':'')+'></td>'+
      '<td><div class="caps">'+CAPS.map(function(k){return '<label class="chk"><input type="checkbox" class="f-cap" value="'+k[0]+'"'+(c[k[0]]?' checked':'')+'>'+k[1]+'</label>'}).join('')+'</div></td>'+
      '<td style="white-space:nowrap"><input class="f-alim" type="number" min="0" placeholder="approve" value="'+(c.approve_limit==null?'':c.approve_limit)+'" style="width:100px"><br>'+
      '<input class="f-vlim" type="number" min="0" placeholder="vouch" value="'+(c.vouch_limit==null?'':c.vouch_limit)+'" style="width:100px;margin-top:4px"></td>'+
      '<td><input type="checkbox" class="f-act"'+(u.active?' checked':'')+'></td>'+
      '<td><button class="btn primary" onclick="saveKs('+i+')">Save</button></td></tr>'}).join('')+
    '</tbody></table></div></div>'+
    '<div class="card"><h2>Add a KEYSTONE user</h2><div class="grid-add">'+
    '<div><div class="sub">Email</div><input id="ksNewEmail" style="width:100%"></div>'+
    '<div><div class="sub">Name</div><input id="ksNewName" style="width:100%"></div>'+
    '<div><div class="sub">Role</div><select id="ksNewRole" style="width:100%">'+KS_ROLES.map(function(r){return '<option'+(r==='Staff'?' selected':'')+'>'+r+'</option>'}).join('')+'</select></div>'+
    '<div><div class="sub">Company</div><select id="ksNewCo" style="width:100%"><option value="">—</option>'+COMPANIES.map(function(x){return '<option>'+esc(x)+'</option>'}).join('')+'</select></div>'+
    '<div><button class="btn primary" onclick="addKs()">Add user</button></div></div>'+
    '<p class="sub" style="margin-top:8px">Capabilities can be ticked after adding.</p></div>';
}
function numOrNull(v){v=String(v).trim();return v===''?null:Number(v)}
async function saveKs(i){
  var u=D.ks[i], tr=el('ks-'+i);
  var patch={name:tr.querySelector('.f-name').value.trim(),role:tr.querySelector('.f-role').value,
    company:tr.querySelector('.f-co').value||null,access_companies:picked(tr,'f-acc'),
    receive_all:tr.querySelector('.f-all').checked,active:tr.querySelector('.f-act').checked};
  var r=await supa.from('keystone_users').update(patch).eq('email',u.email).select();
  if(r.error) return toast(dbErr(r.error));
  if(!r.data||!r.data.length) return toast('Not saved — the database refused the change.');
  var caps={email:u.email,approve_limit:numOrNull(tr.querySelector('.f-alim').value),vouch_limit:numOrNull(tr.querySelector('.f-vlim').value),updated_at:new Date().toISOString()};
  var sel=picked(tr,'f-cap'); CAPS.forEach(function(k){caps[k[0]]=sel.indexOf(k[0])>=0});
  var existing=D.caps.find(function(c){return norm(c.email)===u.email});
  var c2=existing? await supa.from('adm_user_caps').update(caps).eq('email',existing.email)
                 : await supa.from('adm_user_caps').insert(caps);
  if(c2.error) return toast('User saved, but capabilities were not: '+dbErr(c2.error));
  toast('Saved '+u.email); await refresh();
}
async function addKs(){
  var e=norm(el('ksNewEmail').value); if(!validEmail(e)) return toast('Enter a valid email.');
  var r=await supa.from('keystone_users').insert({email:e,name:el('ksNewName').value.trim(),role:el('ksNewRole').value,company:el('ksNewCo').value||null});
  if(r.error) return toast(dbErr(r.error));
  toast('Added '+e+' to KEYSTONE'); await refresh();
}

/* ── Change log ───────────────────────────────────────────────────────────── */
function diffText(b,a){
  if(!b) return 'added as '+esc(a.role);
  if(!a) return 'removed';
  var keys=['name','role','company','active','receive_all','stations','access_companies','notes'];
  var out=keys.filter(function(k){return JSON.stringify(b[k])!==JSON.stringify(a[k])}).map(function(k){
    return esc(k)+': '+esc(JSON.stringify(b[k]))+' → '+esc(JSON.stringify(a[k]))});
  return out.join(' · ')||'no field change';
}
function viewLog(){
  return '<div class="card"><h2>Change log</h2><p class="sub">Every change to the KEYSTONE and PMES lists, from any app. Cannot be edited.</p>'+
    '<div class="tbl-wrap"><table><thead><tr><th>When</th><th>App</th><th>Account</th><th>Change</th><th>By</th></tr></thead><tbody>'+
    (D.log.length?D.log.map(function(l){return '<tr><td style="white-space:nowrap">'+fmt(l.at)+'</td><td>'+esc(l.app)+'</td><td class="mono">'+esc(l.email)+
      '</td><td>'+diffText(l.before,l.after)+'</td><td class="mono">'+esc(l.changed_by||'setup')+'</td></tr>'}).join('')
      :'<tr><td colspan="5" class="muted">Nothing yet.</td></tr>')+'</tbody></table></div></div>';
}

async function refresh(){await loadAll();draw()}
supa.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT')location.reload()});
boot();
</script>
