<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Class Laminate, Inc. Command Center</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="cc.webmanifest">
<meta name="theme-color" content="#12233d">
<link rel="apple-touch-icon" href="icons/command-center/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/command-center/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/command-center/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/command-center/icon-192.png">
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --card2:#f7f9fb; --line:#dde3ea; --text:#15202e; --text2:#5b6878;
  --navy:#12233d; --accent:#1f5fa8; --on-accent:#fff; --teal:#11746c; --amber:#8a5a00; --coral:#b33a2f;
  --wash-amber:#fff4de; --wash-teal:#e3f4f1; --wash-coral:#fde8e5; --wash-blue:#e7eff9;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1318; --card:#171c23; --card2:#1d232b; --line:#2b333d; --text:#e6ebf1; --text2:#9aa6b4;
    --navy:#c9d6e6; --accent:#7fb0ea; --on-accent:#0f1318; --teal:#6fd3c4; --amber:#f1c36b; --coral:#ff9b90;
    --wash-amber:#2c2413; --wash-teal:#12302c; --wash-coral:#351b19; --wash-blue:#16273b;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.brand-t{display:flex;flex-direction:column;line-height:1.05;min-width:0;flex:1 1 200px}
.brand-n{font-size:24px;font-weight:700;letter-spacing:1.5px;color:var(--navy)}
.brand-s{font-size:10.5px;font-weight:500;opacity:.8;letter-spacing:.2px}
@media (max-width:600px){.brand-n{font-size:19px}.brand-s{font-size:9px}.brand-t{flex-basis:0}}
header{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;color:var(--navy)}
header .who{margin-left:auto;font-size:12px;color:var(--text2);text-align:right}
header nav#nav{order:3;flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
nav button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.wrap{max-width:1700px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 8px;color:var(--navy)}
.sub{color:var(--text2);font-size:12.5px;margin:0 0 10px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text2);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.off td{opacity:.55}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
button.btn{font:inherit;cursor:pointer;border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:var(--card2);color:var(--text)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.btn.danger{color:#b42318;border-color:#f3b8b2;background:transparent}
button.btn.danger:hover{background:#fef3f2}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-none{color:var(--text2);border:1px dashed var(--line)}
.p-on{background:var(--wash-teal);color:var(--teal)}
.p-adm{background:var(--wash-blue);color:var(--accent)}
.p-off{background:var(--wash-coral);color:var(--coral)}
.chk{display:inline-flex;gap:4px;align-items:center;margin:2px 10px 2px 0;font-size:12.5px;white-space:nowrap}
.note{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px}
.note.warn{background:var(--wash-amber);color:var(--amber)}
.note.err{background:var(--wash-coral);color:var(--coral)}
.grid-add{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;align-items:end}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.muted{color:var(--text2)}
.caps{display:flex;flex-wrap:wrap;gap:2px 0;min-width:340px;max-width:520px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:var(--card);padding:10px 16px;border-radius:9px;font-size:13px;display:none;z-index:9}
.stat{display:inline-block;margin-right:22px}
.stat b{display:block;font-size:22px;color:var(--navy)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar #lfQ{flex:1;min-width:220px}
.subnav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-2px 0 14px;overflow-x:auto}
.subnav button{background:none;border:none;border-bottom:3px solid transparent;padding:9px 14px;font:inherit;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap}
.subnav button.on{color:var(--accent);border-bottom-color:var(--accent)}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.capgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.editcard{border:2px solid var(--accent)}
nav button .n{font-size:11px;opacity:.75;margin-left:4px}
</style>
</head>
<body>
<header>
  <img src="wcli-logo.jpg" alt="World Class Laminate, Inc." title="World Class Laminate, Inc." style="height:40px;width:auto">
  <div class="brand-t"><span class="brand-n">COMMAND CENTER</span><span class="brand-s">World Class Laminate, Inc. · who may use Modcraft, PMES, KEYSTONE, HATID &amp; ShelfSync</span></div>
  <nav id="nav"></nav>
  <div class="who" id="who"></div>
  <img src="rtmo-logo.png" alt="RTmo Digital Solutions" title="RTmo Digital Solutions" style="height:40px;width:auto;background:#fff;border-radius:7px;padding:2px 6px">
</header>
<div class="wrap" id="root"><div class="card">Loading…</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ─────────────────────────────────────────────────────────────────────────────
   Command Center — one place to manage who may use each app.

   Each app keeps its OWN user list, because the people differ:
     Modcraft  — sales/estimating. Users live in the User Roles Google Sheet (PINs too),
                 which Modcraft still signs in from. Phase 2: edits here write that Sheet AND
                 the database copy (public.users), and are logged. Remove deletes the Sheet
                 row and the database copy (checked and logged the same way).
     KEYSTONE  — admin staff. keystone_users + capabilities (adm_user_caps).
     PMES      — production staff. pmes_users: operator / supervisor / manager / admin,
                 operators optionally limited to stations.
     ShelfSync — Modern Trade depots (promodisers + Plant). Same design as HATID: shelfsync_users here is the
                 master; after each save this page asks ShelfSync (shelfsync-staff-sync) to apply it.
     HATID — logistics dispatch (runs on the Social-Content-Manager project). jobboard_users here is
                 the master list; after each save this page asks HATID (job-staff-sync) to apply
                 it, which checks with Modcraft that the caller may use the Command Center (cc_me().allowed).

   Who may open this page: the people on Access (table cc_access; cc_me().allowed) — Owner = everything,
   Manager = every app's users but not the Access list (2026-10-03; was Modcraft Admin/Director). Every change to the
   KEYSTONE, PMES and HATID lists is written to user_access_log by a database trigger, and the
   database refuses any change that would leave a list with no active admin.
   ───────────────────────────────────────────────────────────────────────────── */
var SUPA_URL='https://nkpekroogqsmfilypowd.supabase.co';
var SUPA_ANON_KEY='sb_publishable_jpp6ZiFup3v0VVRJtjCOTQ_bF-SEpt4';
var supa=supabase.createClient(SUPA_URL,SUPA_ANON_KEY,{auth:{persistSession:true,detectSessionInUrl:true,flowType:'pkce'}});

var COMPANIES=['World Class Laminate, Inc.','Module Systems and Services, Inc.','Cebu World Laminate, Inc.'];
var CO_KEYS=[['wcl','WCL'],['mssi','MSSI'],['cwl','CWL']];
var KS_ROLES=['Admin','Director','Manager','Supervisor','Approver','Encoder','Staff','Viewer'];
var PMES_ROLES=['staff','materials','operator','shift_head','production_engineer','supervisor','manager','admin'];
var CAPS=[['can_request','Request'],['can_approve','Approve'],['can_vouch','Vouch'],['can_release','Release'],
          ['can_source','Source'],['can_issue','Warehouse issue'],['is_plant_head','Head of Plant Ops'],['is_manager_approver','Mgr approver'],['is_hpo_approver','HPO approver'],['is_md_approver','MD approver']];

var JB_ROLES=[['admin','Admin'],['manager','Manager'],['dispatcher','Dispatcher'],['field','Field crew'],['viewer','Office viewer'],['pickup','Pick-up only']];
var JB_PK=[['','—'],['sales_support','Sales Support'],['warehouse','Warehouse (outbound)'],['logistics','Logistics'],['wh_manager','Warehouse Manager / delegate']];
var JB_PKSITE=[['','Any site'],['plant1','Plant 1'],['annex','Annex']];
function jbPkFields(u,idp){ var o=function(list,cur){return list.map(function(x){return '<option value="'+x[0]+'"'+((cur||'')===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')};
  return fld('Pick-up job','<select class="f-pk"'+(idp?' id="'+idp+'Pk"':'')+' style="width:100%">'+o(JB_PK,u&&u.pickup_role)+'</select>')
    +fld('Pick-up site','<select class="f-pksite"'+(idp?' id="'+idp+'PkSite"':'')+' style="width:100%">'+o(JB_PKSITE,u&&u.pickup_site)+'</select>'); }
function jbPkLabel(u){ var x=JB_PK.find(function(k){return k[0]===(u.pickup_role||'')}); return u.pickup_role?(x?x[1]:u.pickup_role)+(u.pickup_site?' · '+(JB_PKSITE.find(function(k){return k[0]===u.pickup_site})||[0,u.pickup_site])[1]:''):''; }
var JB_STEPS=[['review','Review'],['confirm','Confirm'],['approve','Approve']];
var JB_SYNC_URL='https://nssviuuagtlvxjvvvagt.supabase.co/functions/v1/job-staff-sync';

var _qTab=new URLSearchParams(location.search).get('tab');
var ME=null, TAB=({sign:'sign',hatid:'jb',shelfsync:'ss',ss:'ss',access:'cc',cc:'cc',deleg:'pmes',log:'mc',people:'people',mc:'mc',pmes:'pmes',ks:'ks',jb:'jb'})[_qTab]||'people', D={modcraft:[],ks:[],pmes:[],jb:[],ss:[],cc:[],caps:[],stages:[],log:[],shadow:[]};
// Company filter across every list ('' = all, 'none' = no company set). Keys: wcl / mssi / cwl.
var CO_FILTER='';
try{ CO_FILTER=sessionStorage.getItem('cc_co')||''; }catch(e){}
function passCo(company){
  if(!CO_FILTER) return true;
  var k=coKey(company);
  return CO_FILTER==='none'?!k:k===CO_FILTER;
}
function setCo(v){ CO_FILTER=v; try{ sessionStorage.setItem('cc_co',v); }catch(e){} drawNav(); draw(); }

/* ── Modcraft users, phase 1: the User Roles Google Sheet is still the master. This tab reads it
   (read-only), compares every person with the database copy, and can bring the copy up to date.
   The same reading rules as Modcraft's parseUserRows(), so the two can never read a row differently. */
var SHEETS_ID='1Rs79K8wX27lxVRddksNlYwdyesTCOjIhHCqH0jRMV-o';
var ACC_KEYS=['Dashboard','KPI','Reports','Profit/Revenue','Quotations','Analytics','Approvals','Schedule','Projects','Clients','Designers Support','Settings','Users'];
function getDefaultAcc(pos,key){
  var full={Dashboard:true,KPI:true,Reports:true,'Profit/Revenue':true,Quotations:true,Analytics:true,Approvals:true,Schedule:true,Projects:true,Clients:true,'Designers Support':true,Settings:true,Users:true};
  var d={
    'Staff'    :{Dashboard:true,KPI:false,Reports:false,'Profit/Revenue':false,Quotations:true,Analytics:false,Approvals:false,Schedule:true,Projects:true,Clients:true,'Designers Support':false,Settings:false,Users:false},
    'Team Lead':{Dashboard:true,KPI:true, Reports:false,'Profit/Revenue':false,Quotations:true,Analytics:false,Approvals:false,Schedule:true,Projects:true,Clients:true,'Designers Support':true, Settings:false,Users:false},
    'Supervisor':{Dashboard:true,KPI:true,Reports:true, 'Profit/Revenue':false,Quotations:true,Analytics:true, Approvals:true, Schedule:true,Projects:true,Clients:true,'Designers Support':true, Settings:false,Users:false},
    'Manager'  :{Dashboard:true,KPI:true, Reports:true, 'Profit/Revenue':true, Quotations:true,Analytics:true, Approvals:true, Schedule:true,Projects:true,Clients:true,'Designers Support':true, Settings:true, Users:false},
    'Director' :{Dashboard:true,KPI:true, Reports:true, 'Profit/Revenue':true, Quotations:true,Analytics:true, Approvals:true, Schedule:true,Projects:true,Clients:true,'Designers Support':true, Settings:true, Users:false},
    'Admin':full
  };
  return ((d[pos]||d['Staff'])[key])||false;
}
function parseAccBool(v){return v===true||String(v).toUpperCase()==='TRUE'||v==='yes'||v==='1';}
function parseSheetUsers(rows){
  var out=[];
  for(var i=1;i<rows.length;i++){
    var r=rows[i]; if(!r||!r.length) continue;
    var isNew=r[0]&&r[0].indexOf('@')<0&&r[1]&&r[1].indexOf('@')>=0;
    var u={row:i+1,acc:{},delegateTo:'',delegateActive:false,receiveAll:false,accessCompanies:[],mac:''};
    if(isNew){
      u.name=r[0]||''; u.email=r[1]||''; u.pos=r[2]||'Staff'; u.active=(r[3]||'yes').toLowerCase()==='yes'; u.company=r[4]||''; u.mac=r[5]||'';
      for(var k=0;k<8;k++) u.acc[ACC_KEYS[k]]=r[6+k]!==undefined?parseAccBool(r[6+k]):getDefaultAcc(u.pos,ACC_KEYS[k]);
      for(var k2=8;k2<ACC_KEYS.length;k2++) u.acc[ACC_KEYS[k2]]=r[9+k2]!==undefined?parseAccBool(r[9+k2]):getDefaultAcc(u.pos,ACC_KEYS[k2]);
      u.delegateTo=(r[14]||'').trim(); u.delegateActive=parseAccBool(r[15]||''); u.receiveAll=parseAccBool(r[16]||'');
      u.accessCompanies=(r[24]||'').split(',').map(function(x){return x.trim();}).filter(Boolean);
    } else {
      u.email=r[0]||''; u.pos=r[1]||'Staff'; u.active=(r[2]||'yes').toLowerCase()==='yes'; u.company=r[3]||''; u.name=u.email.split('@')[0];
      ACC_KEYS.forEach(function(kk){ u.acc[kk]=getDefaultAcc(u.pos,kk); });
    }
    if(!u.email) continue;
    u.pinHash=r[22]||''; u.pinSalt=r[23]||'';
    u.includeKpi=String(r[25]||'').toUpperCase()==='TRUE';
    u.requirePin=String(r[26]||'').toUpperCase()==='TRUE';
    out.push(u);
  }
  return out;
}
var MC={sheet:null,raw:null,err:'',loading:false,pins:null,busy:false,edit:null};
function gToken(needRw){
  try{ var t=JSON.parse(sessionStorage.getItem('cc_gtok')||'null'); if(t&&t.exp>Date.now()&&(!needRw||t.rw)) return t.tok; }catch(e){}
  return '';
}
// Read access to the Sheet through Modcraft's OWN Google client — the one that already reads it
// every day. (Supabase's Google sign-in belongs to a different Google project, 64620211331, which
// has the Sheets API switched off: that answered 403, 2026-09-26.) A popup, no page reload.
var GOOG_CLIENT_ID='605710112392-vgvmr9e66b8himis6ka118cdq5er6393.apps.googleusercontent.com';
function connectSheet(){
  if(!window.google||!google.accounts||!google.accounts.oauth2){
    MC.err='Google’s sign-in library has not loaded yet — wait a moment and try again.'; draw(); return;
  }
  var tc=google.accounts.oauth2.initTokenClient({
    client_id:GOOG_CLIENT_ID,
    // Phase 2: edit access, so a change made here reaches the Sheet Modcraft signs people in from.
    scope:'https://www.googleapis.com/auth/spreadsheets',
    login_hint:(ME&&ME.email)||'',
    callback:function(resp){
      if(resp.error){ MC.err='Google did not grant access to the Sheet ('+resp.error+').'; draw(); return; }
      var rw=false; try{ rw=google.accounts.oauth2.hasGrantedAllScopes(resp,'https://www.googleapis.com/auth/spreadsheets'); }catch(e){}
      try{ sessionStorage.setItem('cc_gtok',JSON.stringify({tok:resp.access_token,rw:!!rw,
        exp:Date.now()+Math.max(60,(+resp.expires_in||3600)-120)*1000})); }catch(e){}
      readSheet();
    }
  });
  tc.requestAccessToken({prompt:''});
}
async function readSheet(){
  var tok=gToken(); if(!tok){ MC.err='need-token'; draw(); return; }
  MC.loading=true; MC.err=''; draw();
  try{
    var res=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEETS_ID+'/values/'+encodeURIComponent('User Roles!A:AA'),
      {headers:{Authorization:'Bearer '+tok}});
    if(!res.ok){
      // Say exactly what Google answered — a silent fall-back to the Connect button hid this once.
      var why=''; try{ var j=await res.json(); why=(j.error&&(j.error.message||j.error.status))||''; }catch(e){}
      if(res.status===401){ try{ sessionStorage.removeItem('cc_gtok'); }catch(e){} }
      MC.err='Google refused to read the Sheet ('+res.status+(why?': '+why:'')+').'
        +(res.status===401?' The access expired — connect again.':'')
        +(res.status===403&&/scope/i.test(why)?' Read access to the Sheet was not granted — connect again and allow it.':'');
    }
    else { MC.raw=(await res.json()).values||[]; MC.sheet=parseSheetUsers(MC.raw); }
    var ps=await supa.rpc('cc_pin_status'); MC.pins={};
    (ps.data||[]).forEach(function(x){ MC.pins[norm(x.email)]=x; });
  }catch(e){ MC.err='The Sheet could not be read: '+e.message; }
  MC.loading=false; draw();
}

function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(e){return String(e||'').trim().toLowerCase()}
function toast(m){var t=el('toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display='none'},3200)}
function fmt(iso){if(!iso)return '—';var d=new Date(iso);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function validEmail(e){return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)}
function dbErr(e){
  var m=(e&&e.message)||String(e);
  if(/At least one active admin/.test(m)) return 'Refused: that would leave the list with no active admin.';
  if(/At least one active owner/.test(m)) return 'Refused: the Command Center must keep at least one active Owner.';
  if(/row-level security|permission denied/i.test(m)) return 'Refused: only an Owner of the Command Center can do that.';
  if(e&&e.code==='23505') return 'That email is already on the list.';
  return m;
}

async function boot(){
  var s=await supa.auth.getSession();
  if(!s.data.session) return signIn();
  // Right after a Google sign-in that asked for Sheet access, Supabase hands over Google's own
  // access token once. Kept for this browser tab only (Google tokens last ~1 hour).
  // NOT used for the Sheet: that token belongs to Supabase's Google project (64620211331), where the
  // Sheets API is off (403). A leftover copy from an older build is dropped so it can't be picked up.
  try{ var _old=JSON.parse(sessionStorage.getItem('cc_gtok')||'null'); if(_old&&_old.rw===undefined) sessionStorage.removeItem('cc_gtok'); }catch(e){}
  var r=await supa.rpc('cc_me');
  if(r.error) return fatal('Could not check your account: '+esc(r.error.message));
  ME=r.data||{};
  el('who').innerHTML='<b>'+esc(ME.name||ME.email)+'</b>'+(ME.level?' <span class="pill '+(ME.level==='owner'?'p-on':'p-none')+'" title="Your Command Center level">'+(ME.level==='owner'?'Owner':'Manager')+'</span>':'')+'<br>'+esc(ME.email)+
    ' · <a href="#" onclick="supa.auth.signOut().then(function(){location.reload()});return false">Sign out</a>';
  if(!ME.allowed) return fatal('<b>'+esc(ME.email)+'</b> has not been given Command Center access. An Owner can add you under Command Center › Access.');
  await loadAll();
  drawNav(); draw();
  var cameBack=false; try{ cameBack=sessionStorage.getItem('cc_gconnect')==='1'; sessionStorage.removeItem('cc_gconnect'); }catch(e){}
  if(TAB==='mc'&&gToken()) readSheet();
  else if(TAB==='mc'&&cameBack){
    MC.err='Google signed you in but did not hand over read access to the Sheet. Connect again and allow access to Google Sheets when Google asks.';
    draw();
  }
}
function signIn(){
  el('root').innerHTML='<div class="card" style="max-width:440px;margin:40px auto;text-align:center">'+
    '<h2>World Class Laminate, Inc. Command Center</h2><p class="sub">Sign in with your company Google account.</p>'+
    '<button class="btn primary" onclick="supa.auth.signInWithOAuth({provider:\'google\',options:{redirectTo:location.origin+location.pathname}})">Sign in with Google</button></div>';
}
function fatal(html){el('root').innerHTML='<div class="card"><div class="note err">'+html+'</div></div>'}

async function loadAll(){
  var q=await Promise.all([
    supa.from('users').select('*'),
    supa.from('keystone_users').select('*').order('active',{ascending:false}).order('name'),
    supa.from('pmes_users').select('*').order('active',{ascending:false}).order('name'),
    supa.from('adm_user_caps').select('*'),
    supa.from('pmes_stage_types').select('code,label,sort_order').order('sort_order'),
    supa.from('user_access_log').select('*').order('at',{ascending:false}).limit(300),
    supa.from('user_shadow_log').select('id,at,email,ok,diffs,build').order('at',{ascending:false}).limit(1000),
    supa.from('pmes_delegations').select('*').order('starts_at',{ascending:false}).limit(200),

/* ── Modcraft users (phase 1: compare the Sheet with the database copy) ───── */
// "Also sees" is stored as keys (wcl/mssi/cwl); a full company name is turned into its key.
function accKey(x){ var l=String(x||'').trim().toLowerCase(); return /^(wcl|mssi|cwl)$/.test(l)?l:coKey(x); }
function sameArr(a,b){ a=(a||[]).map(accKey).filter(Boolean).sort(); b=(b||[]).map(accKey).filter(Boolean).sort(); return a.join(',')===b.join(','); }
function mcDiffs(u,d){
  // Every field the database copy holds, compared with how Modcraft reads the Sheet.
  var out=[];
  function f(label,a,b){ out.push({label:label,sheet:a,db:b}); }
  if(String(u.name||'').trim()!==String(d.name||'').trim()) f('name',u.name,d.name);
  if(u.pos!==d.role) f('role',u.pos,d.role);
  if(coKey(u.company)!==coKey(d.company)) f('company',u.company,d.company);
  if(!!u.active!==!!d.active) f('active',u.active?'yes':'no',d.active?'yes':'no');
  if(String(u.mac||'')!==String(d.device_id||'')) f('device',u.mac||'—',d.device_id||'—');
  var fa=d.feature_access||{}, accDiff=ACC_KEYS.filter(function(k){ return !!u.acc[k]!==!!fa[k]; });
  if(accDiff.length) f('feature access',accDiff.map(function(k){return k+':'+(u.acc[k]?'on':'off');}).join(', '),accDiff.map(function(k){return k+':'+(fa[k]?'on':'off');}).join(', '));
  if(norm(u.delegateTo)!==norm(d.delegate_to)) f('delegate to',u.delegateTo||'—',d.delegate_to||'—');
  if(!!u.delegateActive!==!!d.delegate_active) f('delegation on',u.delegateActive?'yes':'no',d.delegate_active?'yes':'no');
  if(!!u.receiveAll!==!!d.receive_all) f('all companies',u.receiveAll?'yes':'no',d.receive_all?'yes':'no');
  if(!sameArr(u.accessCompanies,d.access_companies)) f('also sees',(u.accessCompanies||[]).join(', ')||'—',(d.access_companies||[]).join(', ')||'—');
  if(!!u.includeKpi!==!!d.include_in_kpi) f('in KPI',u.includeKpi?'yes':'no',d.include_in_kpi?'yes':'no');
  if(!!u.requirePin!==!!d.require_pin) f('require PIN',u.requirePin?'yes':'no',d.require_pin?'yes':'no');
  return out;
}
function mcRows(){
  var db={}, dup={};
  D.modcraft.forEach(function(d){ var k=norm(d.email); if(db[k]) dup[k]=true; else db[k]=d; });
  var rows=[], seen={};
  (MC.sheet||[]).forEach(function(u){
    var k=norm(u.email); seen[k]=true;
    var d=db[k], pin=MC.pins&&MC.pins[k];
    var diffs=d?mcDiffs(u,d):[];
    var pinState=!pin?'not copied':((!!u.pinHash)!==pin.has_pin?'differs':'same');
    if(pinState!=='same') diffs.push({label:'PIN',sheet:u.pinHash?'set':'not set',db:pin?(pin.has_pin?'set':'not set'):'not copied yet'});
    rows.push({email:k,u:u,d:d,diffs:diffs,state:!d?'sheet-only':(diffs.length?'differs':'same'),dup:!!dup[k],company:u.company});
  });
  D.modcraft.forEach(function(d){ var k=norm(d.email); if(!seen[k]){ seen[k]=true; rows.push({email:k,d:d,diffs:[],state:'db-only',dup:!!dup[k],company:d.company}); } });
  return rows.filter(function(r){ return passCo(r.company); });
}

async function syncMc(){
  var rows=mcRows().filter(function(r){ return r.state==='differs'||r.state==='sheet-only'; });
  if(!rows.length) return;
  if(!confirm('Update the database copy for '+rows.length+' person(s) from the Sheet? The Sheet itself is not changed.')) return;
  MC.busy=true; draw();
  var up=rows.map(function(r){ var u=r.u; return {email:r.email,name:u.name||'',role:u.pos,company:u.company||null,active:!!u.active,
    device_id:u.mac||null,feature_access:u.acc,delegate_to:u.delegateTo||null,delegate_active:!!u.delegateActive,
    receive_all:!!u.receiveAll,access_companies:(u.accessCompanies||[]).map(accKey).filter(Boolean),
    include_in_kpi:!!u.includeKpi,require_pin:!!u.requirePin}; });
  var a=await supa.from('users').upsert(up,{onConflict:'email'});
  var pins=(MC.sheet||[]).map(function(u){ return {email:norm(u.email),pin_hash:u.pinHash||'',pin_salt:u.pinSalt||''}; });
  var b=await supa.rpc('cc_sync_user_pins',{p_rows:pins});
  MC.busy=false;
  if(a.error){ toast('The copy was not updated: '+a.error.message); }
  else if(b.error){ toast('People updated, but PINs were not copied: '+b.error.message); }
  else toast('Database copy updated for '+rows.length+' person(s); PINs copied for '+b.data+'.');
  await loadAll(); await readSheet();
}

/* ── Modcraft users, phase 2 (mirror): a change made here is written to the User Roles Sheet —
   which Modcraft still signs people in from, so it takes effect there at once — and to the
   database copy. Rules: the row is re-read first and the change is refused if it differs from
   what this page loaded; nothing is ever deleted from the Sheet (deactivate instead); PIN hashes
   are only ever cleared (Reset PIN), never written or logged; every change goes to the log. */
var MC_ROLES=['Staff','Team Lead','Supervisor','Manager','Director','Admin'];
var SHEET_W=27; // columns A..AA
function _mcPinAlways(pos){ return pos==='Manager'||pos==='Director'||pos==='Admin'; }
function _padRow(r){ var o=[]; for(var i=0;i<SHEET_W;i++){ var v=r&&r[i]; o.push(v==null?'':String(v)); } return o; }
function _sameRow(a,b){ a=_padRow(a); b=_padRow(b); for(var i=0;i<SHEET_W;i++){ if(a[i]!==b[i]) return false; } return true; }
function _tf(b){ return b?'TRUE':'FALSE'; }
// Exactly the row Modcraft's saveUserRow() writes, column for column. Keep the two in step.
function mcBuildRow(u){
  var a=u.acc||{};
  return [String(u.name||'').trim(),norm(u.email),u.pos,u.active?'yes':'no',String(u.company||'').trim(),String(u.mac||'').trim(),
    _tf(a['Dashboard']),_tf(a['KPI']),_tf(a['Reports']),_tf(a['Profit/Revenue']),_tf(a['Quotations']),_tf(a['Analytics']), // G-L
    _tf(a['Approvals']),_tf(a['Schedule']),                                                                              // M-N
    u.delegateTo||'',_tf(u.delegateActive),_tf(u.receiveAll),                                                           // O-Q
    _tf(a['Projects']),_tf(a['Clients']),_tf(a['Designers Support']),_tf(a['Settings']),_tf(a['Users']),                // R-V
    u.pinHash||'',u.pinSalt||'',                                                                                         // W-X
    (u.accessCompanies||[]).map(accKey).filter(Boolean).join(','),                                                       // Y
    _tf(u.includeKpi),_tf(u.requirePin)];                                                                                // Z-AA
}
function mcDbRow(u){
  return {email:norm(u.email),name:u.name||'',role:u.pos,company:u.company||null,active:!!u.active,device_id:u.mac||null,
    feature_access:u.acc,delegate_to:u.delegateTo||null,delegate_active:!!u.delegateActive,receive_all:!!u.receiveAll,
    access_companies:(u.accessCompanies||[]).map(accKey).filter(Boolean),include_in_kpi:!!u.includeKpi,require_pin:!!u.requirePin};
}
// What the log keeps: whether a PIN is set, never the hash itself.
function mcLogObj(u){ if(!u) return null; var d=mcDbRow(u); d.pin_set=!!u.pinHash; d.sheet_row=u.row||null; return d; }

async function sheetsCall(method,range,body,suffix){
  var tok=gToken(true); if(!tok) throw new Error('Edit access to the Sheet has expired or was not granted — connect again.');
  var res=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEETS_ID+'/values/'+encodeURIComponent(range)+(suffix||''),
    {method:method,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  var j=null; try{ j=await res.json(); }catch(e){}
  if(!res.ok){
    if(res.status===401){ try{ sessionStorage.removeItem('cc_gtok'); }catch(e){} }
    throw new Error('Google answered '+res.status+((j&&j.error&&j.error.message)?': '+j.error.message:''));
  }
  return j||{};
}
// Re-read the row just before writing. Refuse if it moved or changed since this page read it —
// someone may be editing the same person in Modcraft at this moment.
async function mcGuardRow(u){
  var fresh=await sheetsCall('GET','User Roles!A'+u.row+':AA'+u.row);
  var now=(fresh.values||[])[0]||[];
  var loaded=(MC.raw||[])[u.row-1]||[];
  if(norm(now[1])!==norm(u.email)&&norm(now[0])!==norm(u.email))
    throw new Error('Row '+u.row+' no longer holds '+u.email+' — the Sheet was rearranged. Read the Sheet again, then redo the change.');
  if(!_sameRow(now,loaded))
    throw new Error(u.email+' was changed in the Sheet after this page read it (possibly in Modcraft just now). Read the Sheet again and redo the change.');
  return now;
}
function mcNeedRw(){
  if(gToken(true)) return false;
  toast('Editing needs edit access to the Sheet — allow it in the Google popup.');
  connectSheet(); return true;
}
function mcCopy(u){ return JSON.parse(JSON.stringify(u)); }
async function mcAfterWrite(before,next,action,dbWarn){
  var warn=dbWarn||[];
  var d=await supa.from('users').upsert(mcDbRow(next),{onConflict:'email'});
  if(d.error) warn.push('the database copy was not updated ('+d.error.message+') — "Update the database copy" will catch it');
  if(action==='reset PIN'){
    var p=await supa.rpc('cc_sync_user_pins',{p_rows:[{email:norm(next.email),pin_hash:'',pin_salt:''}]});
    if(p.error) warn.push('the PIN copy was not cleared ('+p.error.message+')');
  }
  var l=await supa.rpc('cc_log_sheet_change',{p_email:next.email,p_action:action,p_before:mcLogObj(before),p_after:mcLogObj(next)});
  if(l.error) warn.push('the change was not logged ('+l.error.message+')');
  return warn;
}
async function mcWriteUser(before,next,action){
  if(MC.busy) return; if(mcNeedRw()) return;
  MC.busy=true; draw();
  try{
    var now=await mcGuardRow(before);
    // PINs are set by their owner in Modcraft. Only Reset PIN may change these two columns here.
    if(action!=='reset PIN'){ next.pinHash=now[22]||''; next.pinSalt=now[23]||''; }
    await sheetsCall('PUT','User Roles!A'+before.row+':AA'+before.row,
      {range:'User Roles!A'+before.row+':AA'+before.row,majorDimension:'ROWS',values:[mcBuildRow(next)]},'?valueInputOption=USER_ENTERED');
    var warn=await mcAfterWrite(before,next,action);
    MC.edit=null;
    toast(norm(next.email)+': '+action+' — saved to the Sheet'+(warn.length?'. But '+warn.join('; '):' and the database copy')+'.');
  }catch(e){ toast('Not saved: '+e.message); }
  MC.busy=false;
  await loadAll(); await readSheet();
}
async function mcAddUser(next){
  if(MC.busy) return; if(mcNeedRw()) return;
  MC.busy=true; draw();
  try{
    var fresh=await sheetsCall('GET','User Roles!A:B');
    var taken=(fresh.values||[]).some(function(r){ return norm(r[1])===norm(next.email)||norm(r[0])===norm(next.email); });
    if(taken) throw new Error(next.email+' is already on the Sheet — edit that row instead.');
    await sheetsCall('POST','User Roles!A:AA',{values:[mcBuildRow(next)]},':append?valueInputOption=USER_ENTERED');
    var warn=await mcAfterWrite(null,next,'added');
    MC.edit=null;
    toast(norm(next.email)+' added to the Sheet'+(warn.length?'. But '+warn.join('; '):' and the database copy')+'.');
  }catch(e){ toast('Not added: '+e.message); }
  MC.busy=false;
  await loadAll(); await readSheet();
}
/* Remove a person from Modcraft: delete their row from the User Roles Sheet (checked first, like any
   edit), then the database copy, and log it. Their quotations and history stay. */
async function mcRemoveUser(email){
  var u=mcFind(email); if(!u||MC.busy) return;
  if(_selfGuard(u.email)) return;
  if(mcNeedRw()) return;
  var admins=(MC.sheet||[]).filter(function(x){ return x.active&&(x.pos==='Admin'||x.pos==='Director'); });
  if(u.active&&(u.pos==='Admin'||u.pos==='Director')&&admins.length<=1) return toast('Modcraft must keep at least one active Admin or Director.');
  if(!confirm('Remove '+(u.name||u.email)+' ('+u.email+') from Modcraft?\n\nTheir row is deleted from the User Roles Sheet and they can no longer sign in to Modcraft. Their quotations and history stay. This is recorded in the change log.')) return;
  MC.busy=true; draw();
  try{
    await mcGuardRow(u);
    var tok=gToken(true);
    var meta=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEETS_ID+'?fields=sheets.properties',{headers:{Authorization:'Bearer '+tok}}).then(function(r){ return r.json(); });
    var sh=((meta&&meta.sheets)||[]).map(function(x){ return x.properties; }).find(function(p){ return p.title==='User Roles'; });
    if(!sh) throw new Error('Could not find the User Roles tab in the Sheet.');
    var res=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEETS_ID+':batchUpdate',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify({requests:[{deleteDimension:{range:{sheetId:sh.sheetId,dimension:'ROWS',startIndex:u.row-1,endIndex:u.row}}}]})});
    if(!res.ok){ var j={}; try{ j=await res.json(); }catch(e){} throw new Error('Google answered '+res.status+((j.error&&j.error.message)?': '+j.error.message:'')); }
    var warn=[];
    var d=await supa.from('users').delete().eq('email',norm(u.email));
    if(d.error) warn.push('the database copy was not removed ('+d.error.message+')');
    var l=await supa.rpc('cc_log_sheet_change',{p_email:u.email,p_action:'removed',p_before:mcLogObj(u),p_after:null});
    if(l.error) warn.push('the removal was not logged ('+l.error.message+')');
    MC.edit=null;
    toast(norm(u.email)+' removed from Modcraft'+(warn.length?'. But '+warn.join('; '):'')+'.');
  }catch(e){ toast('Not removed: '+e.message); }
  MC.busy=false;
  await loadAll(); await readSheet();
}

function mcOpenEdit(email){ if(mcNeedRw()) return; MC.edit={mode:'edit',email:email}; draw(); el('mc-editor').scrollIntoView({block:'start'}); }

  var q=ACC_KEYS.indexOf('Quotations'), p=ACC_KEYS.indexOf('Projects');

  if(i===p&&!el('me-acc-'+p).checked) el('me-acc-'+q).checked=false;

  return '<div class="card" id="mc-editor" style="border:2px solid var(--accent)"><h2>'+(add?'Add a Modcraft user':'Edit '+esc(b.name||b.email))+'</h2>'

    +'<div><div class="sub">Role</div><select id="me-role" style="width:100%" onchange="mcRoleChanged()">'+roles.map(function(r){ return '<option'+(r===b.pos?' selected':'')+'>'+esc(r)+'</option>'; }).join('')+'</select></div>'

function mcCollect(b){
  var pos=el('me-role').value, acc={};
  ACC_KEYS.forEach(function(k,i){ acc[k]=el('me-acc-'+i).checked; });
  if(acc['Quotations']) acc['Projects']=true;
  var ac=(pos==='Admin'||pos==='Director')?(b.accessCompanies||[]):CO_KEYS.map(function(k){ return k[0]; }).filter(function(k){ return el('me-ac-'+k).checked; });
  return {row:b.row,name:el('me-name').value.trim(),email:b.email,pos:pos,active:el('me-act').checked,company:el('me-co').value,
    mac:el('me-mac').value.trim(),acc:acc,delegateTo:norm(el('me-dt').value),delegateActive:el('me-da').checked,receiveAll:el('me-ra').checked,
    accessCompanies:ac,includeKpi:el('me-kpi').checked,requirePin:_mcPinAlways(pos)?true:el('me-reqpin').checked,
    pinHash:b.pinHash||'',pinSalt:b.pinSalt||''};
}
function mcSaveEditor(){
  if(!MC.edit) return;
  if(MC.edit.mode==='add'){
    var e=norm(el('me-email').value);
    if(!validEmail(e)) return toast('Enter a valid email.');
    if(!el('me-name').value.trim()) return toast('Enter the full name.');
    if(mcFind(e)) return toast(e+' is already on the Sheet — edit that row instead.');
    var n=mcCollect({email:e,accessCompanies:[]}); n.active=el('me-act').checked; n.pinHash=''; n.pinSalt='';
    if(!confirm('Add '+n.name+' ('+e+') as '+n.pos+(n.company?' at '+n.company:'')+'? They can sign in to Modcraft straight away.')) return;
    return mcAddUser(n);
  }
  var u=mcFind(MC.edit.email); if(!u) return;
  var next=mcCollect(u);
  if(!next.name) return toast('Enter the full name.');
  var ch=mcDiffs(next,mcDbRow(u)).map(function(x){ return x.label; });
  if(!ch.length) return toast('Nothing changed.');
  if(!confirm('Save '+(u.name||u.email)+' — '+ch.join(', ')+'? Modcraft picks this up at their next sign-in.')) return;
  mcWriteUser(u,next,'edited: '+ch.join(', '));
}

/* Phase 3 — shadow sign-in. Modcraft records, after every sign-in, whether the Sheet row and the
   database copy agreed. Phase 4 (sign in from the database) waits for a clean stretch here. */
function mcShadowCard(){
  var rows=D.shadow.filter(function(r){ var u=mcFind(norm(r.email)); return passCo(u?u.company:''); });
  if(!rows.length) return '<div class="card"><h2>Shadow sign-in</h2><p class="sub">Nothing recorded yet. From the build of 2026-09-26 on, every Modcraft sign-in compares the Sheet with the database copy and records the result here. Sign-in itself still uses the Sheet.</p></div>';
  var since=Date.now()-14*864e5, recent=rows.filter(function(r){ return new Date(r.at).getTime()>=since; });
  var bad=recent.filter(function(r){ return !r.ok; });
  var people={}; recent.forEach(function(r){ var k=norm(r.email); if(!people[k]) people[k]={n:0,bad:0,last:r}; people[k].n++; if(!r.ok) people[k].bad++; });
  var lastBad=bad[0]?fmt(bad[0].at):'—';
  var days=recent.length?Math.ceil((Date.now()-new Date(recent[recent.length-1].at).getTime())/864e5):0;
  return '<div class="card"><h2>Shadow sign-in — last 14 days</h2>'
    +'<p class="sub">Modcraft still signs people in from the Sheet; after each sign-in it checks the database copy against it and records the result. Sign-in is switched to the database only after a clean stretch.</p>'
    +'<div style="margin:6px 0 10px"><span class="stat"><b>'+recent.length+'</b>sign-ins checked</span><span class="stat"><b>'+Object.keys(people).length+'</b>people</span>'
    +'<span class="stat"><b>'+bad.length+'</b>disagreed</span><span class="stat"><b>'+days+'</b>days of data</span></div>'
    +(bad.length?'<div class="note warn">Last disagreement '+esc(lastBad)+'. Fix the row (Edit above, or Update the database copy), then watch the next sign-in.</div>':(recent.length?'<div class="note" style="background:var(--wash-teal);color:var(--teal)">Every checked sign-in agreed.</div>':''))
    +'<div class="tbl-wrap"><table><thead><tr><th>Person</th><th>Checks</th><th>Disagreed</th><th>Last check</th><th>Last result</th></tr></thead><tbody>'
    +Object.keys(people).sort().map(function(k){ var p=people[k], u=mcFind(k);
      return '<tr><td>'+esc(u?u.name:'')+' <span class="mono">'+esc(k)+'</span></td><td>'+p.n+'</td><td>'+(p.bad?'<span class="pill p-off">'+p.bad+'</span>':'0')+'</td><td>'+fmt(p.last.at)+'</td>'
        +'<td style="font-size:12px">'+(p.last.ok?'<span class="pill p-on">agreed</span>':(p.last.diffs||[]).map(function(x){ return '<b>'+esc(x.field)+'</b>: '+esc(JSON.stringify(x.sheet))+' → '+esc(JSON.stringify(x.db)); }).join('<br>'))+'</td></tr>'; }).join('')
    +'</tbody></table></div></div>';
}

function capsOf(email){return D.caps.find(function(c){return norm(c.email)===email})||{}}

async function saveKs(i){

/* ── HATID signature + signing passcode (Rommel 2026-09-28) ──
   Drawing a signature with a finger is poor on most phones, so a signer's signature can be set here:
   a picture of it (photo or scan — the paper is cleaned off automatically) or the one they already
   saved in Modcraft. HATID uses it whenever they sign a delivery schedule; they only type their passcode. */
var JBS={email:null,data:null,err:'',busy:false,mc:null};
// Photo/scan → ink only on a transparent background, cropped tight, PNG. cb(dataUrl) or cb(null).
function cleanSigImage(src,cb){
  var img=new Image();
  img.onload=function(){
    var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,900/w,500/h); w=Math.max(1,Math.round(w*k)); h=Math.max(1,Math.round(h*k));
    var c=document.createElement('canvas'); c.width=w; c.height=h; var x=c.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
    var d=x.getImageData(0,0,w,h), p=d.data, x0=w,y0=h,x1=-1,y1=-1;
    // paper level = a bright percentile, so a grey/yellowish photo background still clears
    var lums=[]; for(var i=0;i<p.length;i+=4*7) lums.push(0.299*p[i]+0.587*p[i+1]+0.114*p[i+2]);
    lums.sort(function(a,b){return a-b}); var paper=lums[Math.floor(lums.length*0.6)]||235, hi=paper-18, lo=Math.max(40,paper-120);
    for(var yy=0;yy<h;yy++)for(var xx=0;xx<w;xx++){ var j=(yy*w+xx)*4, L=0.299*p[j]+0.587*p[j+1]+0.114*p[j+2];
      var a=L>=hi?0:L<=lo?255:Math.round((hi-L)/(hi-lo)*255);
      p[j+3]=a; if(a>0){ var f=0.55; p[j]=Math.round(p[j]*f); p[j+1]=Math.round(p[j+1]*f); p[j+2]=Math.round(p[j+2]*f); }
      if(a>40){ if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(yy<y0)y0=yy; if(yy>y1)y1=yy; } }
    if(x1<0){cb(null);return}
    x.putImageData(d,0,0);
    var pad=10; x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w-1,x1+pad); y1=Math.min(h-1,y1+pad);
    var o=document.createElement('canvas'); o.width=x1-x0+1; o.height=y1-y0+1; o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
    cb(o.toDataURL('image/png'));
  };
  img.onerror=function(){cb(null)};
  img.src=src;
}
async function jbLoadSigner(email){
  JBS={email:email,data:null,err:'',busy:false,mc:null}; jbDrawSigner();
  try{ JBS.data=await jbCall({action:'signer',email:email}); }catch(e){ JBS.err=e.message; }
  try{ var r=await supa.from('settings').select('value').eq('key','SIG_'+email).maybeSingle();
    var v=r.data&&r.data.value; if(typeof v==='string'&&/^data:image\//.test(v)) JBS.mc=v; }catch(e){}
  jbDrawSigner();
}
function jbDrawSigner(){
  var box=el('jbSig'); if(!box||!JBS.email) return;
  if(JBS.err){ box.innerHTML='<div class="muted" style="font-size:13px">'+esc(JBS.err)+'</div>'; return; }
  if(!JBS.data){ box.innerHTML='<div class="muted" style="font-size:13px">Checking HATID…</div>'; return; }
  var d=JBS.data, pc=d.passcode||{}, dis=JBS.busy?' disabled':'';
  box.innerHTML='<div class="flex" style="gap:14px;align-items:flex-start;flex-wrap:wrap">'
    +'<div style="min-width:220px"><div class="sub" style="margin:0 0 4px">Signature used in HATID</div>'
    +'<div style="width:240px;height:90px;border:1px dashed var(--line,#ccc);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center">'
    +(d.sig_url?'<img src="'+esc(d.sig_url)+'" alt="Signature" style="max-width:228px;max-height:80px">':'<span class="muted" style="font-size:12px">None yet</span>')+'</div>'
    +'<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">'
    +'<button class="btn"'+dis+' onclick="jbSigUpload()">Upload picture…</button>'
    +(JBS.mc?'<button class="btn"'+dis+' onclick="jbSigFromMc()" title="The signature this person saved in Modcraft">Use Modcraft signature</button>':'')
    +(d.sig_url?'<button class="btn"'+dis+' onclick="jbSigClear()">Remove</button>':'')+'</div>'
    +'<div class="muted" style="font-size:12px;margin-top:6px;max-width:420px">A clear photo or scan of the signature on white paper. The paper is removed automatically.</div></div>'
    +'<div><div class="sub" style="margin:0 0 4px">Signing passcode</div>'
    +'<div style="font-size:13px">'+(pc.locked_until?'<span class="pill p-off">Locked until '+esc(new Date(pc.locked_until).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'}))+'</span> — too many wrong tries'
      :pc.set?'<span class="pill p-on">Set</span> '+(pc.set_at?'<span class="muted">since '+esc(new Date(pc.set_at).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'}))+'</span>':'')
      :'<span class="pill p-none">Not set yet</span> <span class="muted">— they create it the first time they sign</span>')+'</div>'
    +(pc.set?'<button class="btn" style="margin-top:8px"'+dis+' onclick="jbPcReset()">Reset signing passcode</button>':'')+'</div></div>';
}
async function jbSigSave(dataUrl,what){
  if(!dataUrl) return toast('Could not find a signature in that picture — try a clearer photo on white paper.');
  JBS.busy=true; jbDrawSigner();
  try{ await jbCall({action:'set_signature',email:JBS.email,image:dataUrl}); await supa.rpc('cc_log_jobboard',{p_email:JBS.email,p_action:'HATID signature set ('+what+')'}); toast('Signature saved to HATID'); JB.staff=null; }
  catch(e){ toast('Signature not saved: '+e.message); }
  await jbLoadSigner(JBS.email); if(!JB.staff) jbLoadStatus();
}
function jbSigUpload(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=function(){ var f=inp.files&&inp.files[0]; if(!f) return;
    if(f.size>15e6) return toast('That file is too large.');
    var r=new FileReader(); r.onload=function(){ cleanSigImage(r.result,function(u){ jbSigSave(u,'uploaded'); }); }; r.readAsDataURL(f); };
  inp.click();
}
function jbSigFromMc(){ if(!JBS.mc) return; cleanSigImage(JBS.mc,function(u){ jbSigSave(u,'from Modcraft'); }); }
async function jbSigClear(){
  if(!confirm('Remove this signature from HATID? Schedules already signed keep their signature.')) return;
  JBS.busy=true; jbDrawSigner();
  try{ await jbCall({action:'clear_signature',email:JBS.email}); await supa.rpc('cc_log_jobboard',{p_email:JBS.email,p_action:'HATID signature removed'}); toast('Signature removed'); JB.staff=null; }
  catch(e){ toast(e.message); }
  await jbLoadSigner(JBS.email); if(!JB.staff) jbLoadStatus();
}
async function jbPcReset(){
  if(!confirm('Reset this person’s signing passcode? They will create a new one the next time they sign in HATID.')) return;
  JBS.busy=true; jbDrawSigner();
  try{ await jbCall({action:'reset_passcode',email:JBS.email}); await supa.rpc('cc_log_jobboard',{p_email:JBS.email,p_action:'HATID signing passcode reset'}); toast('Signing passcode reset'); }
  catch(e){ toast(e.message); }
  await jbLoadSigner(JBS.email);
}

        +(ME&&norm(ME.email)===norm(u.email)?' <span class="muted">(you)</span>':'')+'</td><td class="mono">'+esc(u.email)+'</td>'
        +'<td>'+ccLevelPill(u.level)+'</td><td>'+actPill(u.active)+'</td><td>'+esc(u.notes||'—')+'</td>'
        +'<td class="mono" style="white-space:nowrap">'+(u.updated_at?fmt(u.updated_at)+(u.updated_by?' <span class="muted">'+esc(u.updated_by)+'</span>':''):'—')+'</td>'
        +'<td>'+(own?'<button class="btn" onclick="openEd(\'cc\','+i+')">Edit</button>':'')+'</td></tr>'}).join('')
      :'<tr><td colspan="7" class="muted">Nobody yet.</td></tr>')
    +'</tbody></table></div></div>';
}

/* ── Change log (per app) ── */
function viewLog(app){
  var apps=LOG_APPS[app]||[], rows=D.log.filter(function(l){return apps.indexOf(String(l.app||'').toUpperCase())>=0});
  return '<div class="card"><p class="sub">Every change to this app’s user list — who changed whose access, and when'+(app==='mc'?' (MODCRAFT-SHEET rows are Sheet edits made here)':'')+'. Cannot be edited.</p>'
    +listBar('','')
    +'<div class="tbl-wrap"><table><thead><tr><th>When</th><th>App</th><th>Account</th><th>Change</th><th>By</th></tr></thead><tbody>'
    +(rows.length?rows.map(function(l){return '<tr'+sAttr([l.email,l.changed_by,l.app,l.action,JSON.stringify(l.after||'')],false)+'><td style="white-space:nowrap">'+fmt(l.at)+'</td><td>'+esc(l.app)+'</td><td class="mono">'+esc(l.email)+
      '</td><td>'+(l.before||l.after?diffText(l.before,l.after):esc(l.action))+'</td><td class="mono">'+esc(l.changed_by||'setup')+'</td></tr>'}).join('')
      :'<tr><td colspan="5" class="muted">Nothing yet.</td></tr>')+'</tbody></table></div></div>';
}

async function refresh(){await loadAll();drawNav();draw()}

/* ── PMES approval delegations (added 2026-09-27) ────────────────────────────
   A PMES manager hands their Job Order approval authority to a named person for a period.
   Same database functions PMES uses (pmes_delegate_create / pmes_delegate_revoke); Command Center
   admins may set one up for any manager. History is kept — ended, never deleted. */
function viewDeleg(){
  var users=D.pmes.filter(function(u){return u.active!==false});
  var nameOf=function(e){var u=D.pmes.find(function(x){return norm(x.email)===norm(e)});return u?(u.name||u.email):e};
  var mgrs=users.filter(function(u){return u.role==='manager'||u.role==='admin'});
  var dels=users.filter(function(u){return ['staff','supervisor','manager'].indexOf(u.role)>=0});
  var now=Date.now(), pad=function(n){return String(n).padStart(2,'0')};
  var loc=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
  var st=function(d){return d.revoked_at?['p-off','Ended '+fmt(d.revoked_at)]:new Date(d.ends_at)<=now?['p-off','Expired']
    :new Date(d.starts_at)>now?['p-none','Upcoming']:['p-on','Active']};
  var rows=(D.deleg||[]).filter(function(d){
    if(!CO_FILTER) return true;
    var u=D.pmes.find(function(x){return norm(x.email)===norm(d.from_email)});
    return CO_FILTER==='none'?!(u&&u.company):coKey(u&&u.company)===CO_FILTER;});
  return '<div class="card"><h2 style="margin-top:0">PMES approval delegation</h2>'+
    '<p class="sub">When a PMES manager is away, their Job Order approval authority can go to a named person for up to 60 days. '+
    'Approvals made that way are recorded in PMES as “On behalf of …”. The person who checked a Job Order still cannot approve it.</p>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:8px">'+
      '<div><div class="sub">Manager</div><select id="dgFrom" style="width:100%">'+mgrs.map(function(u){return '<option value="'+esc(u.email)+'">'+esc(u.name||u.email)+'</option>'}).join('')+'</select></div>'+
      '<div><div class="sub">Delegate to</div><select id="dgTo" style="width:100%"><option value="">— choose —</option>'+dels.map(function(u){return '<option value="'+esc(u.email)+'">'+esc((u.name||u.email)+' · '+u.role)+'</option>'}).join('')+'</select></div>'+
      '<div><div class="sub">From</div><input type="datetime-local" id="dgStart" style="width:100%" value="'+loc(new Date())+'"></div>'+
      '<div><div class="sub">Until</div><input type="datetime-local" id="dgEnd" style="width:100%" value="'+loc(new Date(now+7*864e5))+'"></div>'+
    '</div><input id="dgReason" placeholder="Reason (e.g. on leave, site visit)" style="width:100%;margin-top:8px">'+
    '<button class="btn primary" style="margin-top:8px" onclick="ccDelegCreate()">Delegate approval</button></div>'+
    '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Manager</th><th>Delegate</th><th>Period</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>'+
    (rows.length?rows.map(function(d){var s=st(d);return '<tr><td>'+esc(nameOf(d.from_email))+'</td><td>'+esc(nameOf(d.to_email))+'</td>'+
      '<td class="mono">'+esc(fmt(d.starts_at))+' – '+esc(fmt(d.ends_at))+'</td><td>'+esc(d.reason)+(d.revoke_note?'<div class="sub">Ended: '+esc(d.revoke_note)+'</div>':'')+
      '<div class="sub">set by '+esc(d.created_by)+'</div></td><td><span class="pill '+s[0]+'">'+esc(s[1])+'</span></td>'+
      '<td>'+(!d.revoked_at&&new Date(d.ends_at)>now?'<button class="btn" onclick="ccDelegEnd(\''+esc(d.id)+'\')">End now</button>':'')+'</td></tr>'}).join('')
      :'<tr><td colspan="6" class="sub">No delegations yet.</td></tr>')+'</tbody></table></div></div>';
}
async function ccDelegCreate(){
  var to=el('dgTo').value, s=el('dgStart').value, e=el('dgEnd').value, r=el('dgReason').value.trim();
  if(!to) return toast('Choose who receives the approval authority.');
  if(!s||!e) return toast('Set the period.');
  if(!r) return toast('Give the reason.');
  var res=await supa.rpc('pmes_delegate_create',{p_from:el('dgFrom').value,p_to:to,p_start:new Date(s).toISOString(),p_end:new Date(e).toISOString(),p_reason:r});
  if(res.error) return toast(res.error.message);
  toast('Delegated. The person must reload PMES to see it.'); refresh();
}
async function ccDelegEnd(id){
  var note=prompt('End this delegation now? Optional note:'); if(note===null) return;
  var res=await supa.rpc('pmes_delegate_revoke',{p_id:id,p_note:note});
  if(res.error) return toast(res.error.message);
  toast('Delegation ended.'); refresh();
}
