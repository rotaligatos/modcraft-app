<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modcraft — Quotation page across screen sizes</title>
<style>
:root{--navy:#1a3c5e;--teal:#0f6e56;--amber:#ba7517;--coral:#d85a30;--muted:#888;
  --bg:#f4f4f2;--card:#fff;--border:#e0ddd6;--text:#1a1a1a;--text2:#666}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;background:#e8e6e1;color:var(--text)}
button{font-family:inherit;font-size:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:.5px solid var(--border);
  padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar h1{font-size:15px;font-weight:600;white-space:nowrap}
.seg{display:inline-flex;background:#f4f4f2;border:.5px solid var(--border);border-radius:8px;padding:2px;gap:2px}
.seg button{height:28px;padding:0 11px;border:none;border-radius:6px;background:transparent;
  color:var(--text2);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lbl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.stats{margin-left:auto;display:flex;gap:18px;align-items:center;font-size:11.5px;color:var(--text2)}
.stats b{display:block;font-size:16px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.15}
.stats .good b{color:var(--teal)}
.stage{padding:18px;display:flex;justify-content:center}
.frame{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;
  box-shadow:0 6px 24px rgba(0,0,0,.10);transition:width .28s cubic-bezier(.22,.9,.3,1)}
.frame iframe{display:block;width:100%;height:720px;border:0}
.cap{text-align:center;font-size:11.5px;color:var(--text2);padding:6px 0 0}
.note{max-width:1100px;margin:0 auto 14px;font-size:12px;color:#4a4a46;line-height:1.6;
  background:#fff;border:.5px solid var(--border);border-left:2px solid var(--amber);
  border-radius:8px;padding:11px 14px}
</style>
</head>
<body>

<div class="bar">
  <h1>Quotation page — across screen sizes</h1>
  <span class="lbl">Screen</span>
  <div class="seg" id="sizes" role="group" aria-label="Screen width"></div>
  <span class="lbl">Layout</span>
  <div class="seg" role="group" aria-label="Layout">
    <button id="m-now" aria-pressed="true"  onclick="setLayout('now')">Now (fixed 800px)</button>
    <button id="m-new" aria-pressed="false" onclick="setLayout('new')">Adaptive</button>
  </div>
  <div class="stats">
    <div>Width<b id="s-w">—</b></div>
    <div>Page height<b id="s-h">—</b></div>
    <div>Scrolling<b id="s-s">—</b></div>
    <div class="good"><b id="s-d"></b></div>
  </div>
</div>

<div class="stage"><div>
  <div class="note" id="note"></div>
  <div class="frame" id="frame" style="width:1440px"><iframe id="fr" title="Quotation page preview"></iframe></div>
  <div class="cap" id="cap"></div>
</div></div>

<script>
/* The page under test lives in an iframe, because media queries fire on the
   IFRAME's width — which is the only honest way to demonstrate responsiveness.
   Scaling a div would prove nothing. */
var SIZES=[
  {k:'phone',  w:375, l:'Phone 375'},
  {k:'tablet', w:768, l:'Tablet 768'},
  {k:'embed',  w:1000,l:'Sites embed ~1000'},
  {k:'laptop', w:1280,l:'Laptop 1280'},
  {k:'desk',   w:1440,l:'Desktop 1440'},
  {k:'wide',   w:1920,l:'Wide 1920'}
];
var size=1440, layout='now';

function CSS(){ return `
:root{--navy:#1a3c5e;--teal:#0f6e56;--amber:#ba7517;--coral:#d85a30;--muted:#888;
  --bg:#f4f4f2;--card:#fff;--border:#e0ddd6;--text:#1a1a1a;--text2:#666}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;background:var(--bg);color:var(--text)}
.topbar{height:44px;background:#fff;border-bottom:.5px solid var(--border);display:flex;align-items:center;
  gap:8px;padding:0 12px;overflow-x:auto;white-space:nowrap}
.topbar .t{font-size:12px;color:var(--text2);padding:0 6px}
.topbar .t.on{color:var(--navy);font-weight:600}
.card{background:#fff;border:.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;
  border-bottom:.5px solid var(--border);background:#fafaf8}
.card-head h3{font-size:12.5px;font-weight:500}
.card-body{padding:14px}
.fld{font-size:10.5px;color:var(--text2);display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:0 9px;height:33px;border:.5px solid #ccc;border-radius:6px;
  font-size:12.5px;font-family:inherit;background:#fff;color:var(--text)}
.fw{margin-bottom:10px}
.pill{display:inline-flex;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:#e9eef4;color:var(--navy)}
.sub{font-size:11.5px;color:var(--text2)}
.money{font-variant-numeric:tabular-nums}

/* ── the only structural difference between the two layouts ────────────── */
.wrap{padding:14px}
${layout==='now' ? `
/* NOW — one fixed 800px column whatever the screen is. On 1440 that leaves
   ~600px unused; on a phone it forces sideways scrolling. */
.wrap{max-width:800px;margin:0 auto}
.grid{display:block}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
.items{display:grid;grid-template-columns:2fr 78px 90px 90px;gap:7px;align-items:center;margin-bottom:6px}
` : `
/* ADAPTIVE — fluid to 1560, and the column count follows the width. The cards
   are independent, so this is a container change, not a rewrite. */
.wrap{max-width:1560px;margin:0 auto}
.grid{display:grid;gap:0 16px;align-items:start}
.f2{display:grid;grid-template-columns:1fr;gap:0}
.f3{display:grid;grid-template-columns:1fr;gap:0}
.items{display:grid;grid-template-columns:1fr 62px 74px 78px;gap:6px;align-items:center;margin-bottom:6px}
@media (min-width:640px){
  .f2{grid-template-columns:1fr 1fr;gap:0 16px}
  .items{grid-template-columns:2fr 70px 84px 88px;gap:7px}
}
@media (min-width:900px){ .f3{grid-template-columns:1fr 1fr 1fr;gap:0 16px} }
/* Two columns once there is genuinely room for two readable ones. NOT three:
   an earlier version declared a third track at 1560 with only two children and
   left an empty column. Above 1560 the columns simply get roomier. */
@media (min-width:1180px){ .grid{grid-template-columns:1.5fr 1fr} }
@media (min-width:1560px){ .grid{grid-template-columns:1.45fr 1fr;gap:0 22px} }
`}
`;}

function BODY(){
  var tabs=['Dashboard','Quotation','Projects','Orders','Clients','Schedule','Designers Support','Reports','Approvals','Settings']
    .map(function(t,i){return '<span class="t'+(i===1?' on':'')+'">'+t+'</span>';}).join('');
  var client='<div class="card"><div class="card-head"><h3>Client information</h3><span class="pill">Direct</span></div>'
    +'<div class="card-body"><div class="f2">'
    +fld('Client name','Alpha Corporation')+fld('Business name','Alpha Corporation')
    +fld('Contact person','A. Reyes')+fld('Contact number','0917 000 0000')
    +fld('Email','orders@alphacorp.example')+sel('Segment','General Contractors')
    +'</div>'+fld('Project name','Kitchen fit-out — Tower B')
    +'<div class="f2">'+fld('Project location','Pasig City')+fld('City','Metro Manila')+'</div>'
    +'<div class="f3">'+sel('Service required','Fabrication with Installation')+sel('Pickup / Delivery','Delivery')+sel('Lead source','Referral')+'</div>'
    +'</div></div>';
  var scope='<div class="card"><div class="card-head"><h3>Scope of work</h3><span class="pill">By cutting list</span></div>'
    +'<div class="card-body"><div style="font-weight:600;font-size:12.5px;margin-bottom:8px">Area 1 — Kitchen</div>'
    +item('Panel cutting','240','35','8,400.00')+item('Edgebanding EVA','310','28','8,680.00')
    +item('Boring 35mm (Hinges)','96','12','1,152.00')
    +'<div style="text-align:right;font-size:12px;margin-top:8px" class="sub">Area subtotal <b style="color:var(--text)">₱18,232.00</b></div>'
    +'</div></div>';
  var summary='<div class="card"><div class="card-head"><h3>Quotation summary</h3></div><div class="card-body">'
    +row('Fabrication','₱18,232.00')+row('Fab. contingency (10%)','₱1,823.20')+row('Subtotal','₱20,055.20')+row('VAT (12%)','₱2,406.62')
    +'<div style="border-top:.5px solid var(--border);margin-top:9px;padding-top:9px;display:flex;justify-content:space-between;align-items:center">'
    +'<span style="font-size:12.5px;font-weight:600">Grand total</span>'
    +'<span class="money" style="font-size:18px;font-weight:600;color:var(--navy)">₱22,461.82</span></div></div></div>';
  var charges='<div class="card"><div class="card-head"><h3>Charges &amp; options</h3></div><div class="card-body">'
    +opt('Assembly',true)+opt('Cutting list charge',false)+opt('Design charge',false)+opt('Site visit',true)+opt('Bond &amp; Insurance',false)
    +'</div></div>';
  var pricing=card('Pricing adjustments', sel('VAT treatment','Vatable (12% inclusive)')+fld('Discount %','0'));
  // Set-once and reference cards only. Pricing adjustments is a real decision
  // taken while quoting, so it stays in the main column — and putting it here
  // made the rail 245px TALLER than the work column, which defeats the point.
  var small=[
    card('Project Size', fld('Components','310 detected')),
    card('Contingency &amp; charges', fld('Fabrication contingency %','10')),
    card('Scheduling &amp; timeline', fld('Fabrication start','2026-08-12')+fld('Installation start','2026-08-26')),
    card('Other Cost','<div class="sub">None added</div>'),
    card('Activity log','<div class="sub">Draft saved · 09:14<br>Quotation created · 09:12</div>')
  ].join('');

  if(layout==='now'){
    return '<div class="topbar">'+tabs+'</div><div class="wrap">'
      + client + scope + charges + pricing + small + summary + '</div>';
  }
  // Adaptive: the work in the main column, the set-once and reference cards in
  // the rail. At one column the rail simply falls underneath, in the same order.
  return '<div class="topbar">'+tabs+'</div><div class="wrap"><div class="grid">'
    + '<div>'+client+scope+pricing+summary+'</div>'
    + '<div>'+charges+small+'</div>'
    + '</div></div>';
}
function fld(l,v){return '<div class="fw"><label class="fld">'+l+'</label><input value="'+v+'"></div>';}
function sel(l,v){return '<div class="fw"><label class="fld">'+l+'</label><select><option>'+v+'</option></select></div>';}
function item(n,q,p,t){return '<div class="items"><input value="'+n+'"><input value="'+q+'"><input value="'+p+'"><div class="money" style="text-align:right;font-size:12px">'+t+'</div></div>';}
function row(l,v){return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0" class="sub"><span>'+l+'</span><b class="money" style="color:var(--text)">'+v+'</b></div>';}
function card(t,b){return '<div class="card"><div class="card-head"><h3>'+t+'</h3></div><div class="card-body">'+b+'</div></div>';}
function opt(n,on){
  return '<div style="display:flex;align-items:center;height:36px;border-bottom:.5px solid #f2f0eb">'
    +'<span style="flex:1;font-size:12.5px">'+n+'</span>'
    +'<span style="width:34px;height:20px;border-radius:11px;background:'+(on?'var(--teal)':'#d8d4cc')+';position:relative">'
    +'<span style="position:absolute;top:2px;left:'+(on?'16px':'2px')+';width:16px;height:16px;border-radius:50%;background:#fff"></span>'
    +'</span></div>';
}

function paint(){
  var fr=document.getElementById('fr');
  var d=fr.contentDocument;
  d.open();
  d.write('<!DOCTYPE html><html><head><meta charset="utf-8"><style>'+CSS()+'</style></head><body>'+BODY()+'</body></html>');
  d.close();
  setTimeout(readout,60);
}
function measureFor(l){
  var saved=layout; layout=l; paint();
  var d=document.getElementById('fr').contentDocument;
  var h=d&&d.body?Math.round(d.body.scrollHeight):0;
  layout=saved;
  return h;
}
function readout(){
  var d=document.getElementById('fr').contentDocument;
  var h=d&&d.body?Math.round(d.body.scrollHeight):0;
  document.getElementById('s-w').textContent=size+'px';
  document.getElementById('s-h').textContent=h.toLocaleString()+'px';
  document.getElementById('s-s').textContent=(h/720).toFixed(1)+'× screen';
  // horizontal overflow is the failure that matters most on a phone
  var over=d&&d.documentElement?Math.max(0,d.documentElement.scrollWidth-size):0;
  var el=document.getElementById('s-d');
  el.parentElement.className=over?'':'good';
  el.style.color=over?'var(--coral)':'';
  el.textContent=over?('scrolls sideways '+over+'px'):'no sideways scroll';
  document.getElementById('cap').textContent=
    (layout==='now'?'Fixed 800px column':'Fluid, column count follows width')+' · frame '+size+'px';
}
function setSize(w){
  size=w;
  document.getElementById('frame').style.width=w+'px';
  [].forEach.call(document.querySelectorAll('#sizes button'),function(b){
    b.setAttribute('aria-pressed', +b.dataset.w===w);
  });
  setTimeout(readout,320);
}
function setLayout(l){
  layout=l;
  document.getElementById('m-now').setAttribute('aria-pressed',l==='now');
  document.getElementById('m-new').setAttribute('aria-pressed',l==='new');
  document.getElementById('note').innerHTML = l==='now'
    ? '<b>Today.</b> One 800px column at every screen size. On a 1440px desktop about 600px sits '
      +'unused; on a phone the fixed line-item grid and the nav force sideways scrolling. The app has '
      +'<b>two</b> responsive breakpoints in 32,000 lines, and 61 of its 110 grid templates use fixed '
      +'pixel columns.'
    : '<b>Adaptive.</b> Fluid to 1560px, and the column count follows the width: one column below '
      +'1180, two above it, three above 1560. Work on the left (client, scope, summary), set-once and '
      +'reference cards on the right — and at one column the right-hand cards simply fall underneath '
      +'in the same order. Fields stack below 640px instead of overflowing.';
  paint();
}
document.getElementById('sizes').innerHTML=SIZES.map(function(s){
  return '<button data-w="'+s.w+'" aria-pressed="'+(s.w===1440)+'" onclick="setSize('+s.w+')">'+s.l+'</button>';
}).join('');
setLayout('now'); setSize(1440);
</script>
</body>
</html>
